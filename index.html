/* ---- album: one slot size (96), one gap (16), holes cast no shadow, polaroids share the small radius ---- */
#album .albumRow { gap: 16px; }
.badgeSlot { width: 96px; height: 96px; }
.badgeSlot svg { width: 62px; height: 62px; }
.buddySlot:not(.filled), .badgeSlot:not(.filled), .photoSlot.empty { box-shadow: none; }
.photoSlot { border-radius: var(--v-r-sm); }
.photoCar { border-radius: 10px; }
/* ============ GARAGE REDESIGN: one hierarchy — the car is the hero, GO is the one primary action ============
   stage coordinates: top bar 24-120 (profile 24 | album right 240 | wallet right 24)
   hero: preview 506 wide, floor line y≈436; right column x-centre 1086, 16px rhythm: gift 192-280 (daily, contextual) on the wall,
   map 392-488 resting on the bench rim, GO 504-684. The shuffle ends the tab row at x 664-740, 28px after the wrench (12.8). Upkeep lives on the workbench tab only;
   the wrench tab wears a pulsing dot while the truck needs something. bench rim 432-440; tabs y 452-528 from x 120;
   strip row y 548-664: prev arrow 24-100 | strip 112-872 (7 tiles of 96 + 12 gaps, 8px side padding) | next 884-960 */
#garageWall { background-image: radial-gradient(rgba(90, 70, 52, .032) 2.4px, transparent 2.6px); }
#albumBtn { position: absolute; right: 240px; top: 24px; width: 96px; height: 96px; z-index: 20; }
/* the shuffle ends the tab row (12.8): same footprint as a tab, surface white, set apart by a wider gap so it reads as a tool */
#diceBtn { width: 76px; height: 76px; margin-left: 28px; border-radius: var(--v-r-md); flex: none; }
#diceBtn svg { width: 50px; height: 50px; }

/* --- category tabs: putty at rest, the chosen one lifts in blue with the map's yellow outline --- */
#catTabs { position: absolute; left: 120px; top: 12px; display: flex; gap: 12px; align-items: center; }
.catTab {
  width: 76px; height: 76px; padding: 0; cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--v-mute); border: 5px solid var(--v-mute-line); border-radius: var(--v-r-md);
  box-shadow: 0 5px 0 var(--v-mute-down);
  transition: transform .14s cubic-bezier(.34, 1.56, .64, 1), background .14s, box-shadow .14s;
}
.catTab svg { width: 48px; height: 48px; opacity: .9; }
.catTab [fill="#023047"] { fill: var(--v-wood-dark); }
.catTab [stroke="#023047"] { stroke: var(--v-wood-dark); }
.catTab:active { transform: translateY(3px) scale(.96); box-shadow: 0 1px 0 var(--v-mute-down); }
.catTab.sel {
  background: var(--v-accent-blue); border-color: var(--v-blue-line); box-shadow: 0 5px 0 var(--v-blue-down);
  outline: 6px solid var(--v-accent-yellow); transform: translateY(-4px);
}
.catTab.sel svg { opacity: 1; }
/* the wrench tab wears a red dot while the truck needs upkeep (dings, mud, low fuel, bald tires) */
.catTab .alert {
  position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--v-accent-red); border: 4px solid var(--v-surface); display: none;
}
.catTab { position: relative; }
.catTab.needs .alert { display: block; animation: pulse 1.1s ease infinite; }
.catTab.sel [fill="#023047"] { fill: var(--v-ink-strong); }
.catTab.sel [stroke="#023047"] { stroke: var(--v-ink-strong); }

/* --- options strip: one momentum scroller with page arrows at its ends --- */
#stripRow { position: absolute; left: 24px; top: 108px; height: 116px; display: flex; align-items: center; gap: 12px; }
#strip {
  width: 760px; height: 116px; box-sizing: border-box; padding: 10px 8px;
  display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scroll-padding-inline: 8px; -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain; scrollbar-width: none; transition: opacity .12s;
}
#strip::-webkit-scrollbar { display: none; }
#strip.fade { opacity: 0; }
.stripArrow {
  width: 76px; height: 76px; padding: 0; flex: none; cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  transition: transform .1s cubic-bezier(.34, 1.56, .64, 1), box-shadow .1s, opacity .2s;
}
.stripArrow svg { width: 40px; height: 40px; }
.stripArrow:active { transform: translateY(5px) scale(.96); box-shadow: 0 1px 0 var(--v-surface-down); }
.stripArrow.off { visibility: hidden; }
.stripArrow.end { opacity: .35; }

/* --- tiles: 96px cream cards; colored variants for extras / workbench --- */
.tile {
  position: relative; flex: none; width: 96px; height: 96px; padding: 0; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--v-surface); border: 5px solid var(--v-surface-line); border-radius: var(--v-r-lg);
  box-shadow: 0 6px 0 var(--v-surface-down); cursor: pointer; touch-action: pan-x; scroll-snap-align: start;
  transition: transform .1s cubic-bezier(.34, 1.56, .64, 1), box-shadow .1s, opacity .15s;
}
.tile.pressed { transform: translateY(4px) scale(.97, .94); box-shadow: 0 2px 0 var(--v-surface-down); }
.tile.sel, .tile.on { outline: 6px solid var(--v-accent-yellow); }
.tile.justSel { animation: chipPop .35s ease; }
.tile.enter { animation: popIn .3s cubic-bezier(.2, 1.6, .4, 1) backwards; animation-delay: calc(var(--i, 0) * 35ms); }
.tile.justSel.enter { animation: popIn .3s cubic-bezier(.2, 1.6, .4, 1) backwards, chipPop .35s ease; }
.tile .carPic { width: 84px; height: 51px; overflow: visible; }
.tile .wheelPic { width: 64px; height: 64px; }
.tile .decalPic { width: 64px; height: 64px; overflow: visible; }
.tile .swatchPic { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(74, 53, 35, .14); }
.tile .swatchPic svg { display: block; width: 100%; height: 100%; }
.tile .glyph { width: 54px; height: 54px; }
.tile .nonePic { width: 40px; height: 40px; border-radius: 50%; border: 5px dashed rgba(138, 115, 96, .55); box-sizing: border-box; }
/* a locked tile makes room for its star price */
.tile.locked .carPic { width: 70px; height: 43px; }
.tile.locked .wheelPic, .tile.locked .decalPic { width: 50px; height: 50px; }
.tile.locked .swatchPic { width: 48px; height: 48px; }
.tile .upgPrice { font-size: 17px; color: var(--v-ink); }
.tile .upgPrice svg { width: 17px; height: 17px; }
.tile .lockDot { right: -5px; bottom: -5px; }
.tile .pips { gap: 4px; } .tile .pips i { width: 11px; height: 11px; }
/* wood tiles: extras (dim until on) and the workbench upgrades (green when maxed) */
.tile.wood { background: var(--v-wood-deep); border-color: var(--v-wood-line); box-shadow: 0 6px 0 var(--v-wood-dark); }
.tile.wood.pressed { box-shadow: 0 2px 0 var(--v-wood-dark); }
.tile.wood .upgPrice { color: #fff; }
.tile.dim { opacity: .62; }
.tile.on, .tile.maxed { background: var(--v-accent-green); border-color: var(--v-green-line); box-shadow: 0 6px 0 var(--v-green-down); opacity: 1; }
.tile.red { background: var(--v-accent-red); border-color: var(--v-red-line); box-shadow: 0 6px 0 var(--v-red-down); }
.tile.blue { background: var(--v-accent-blue); border-color: var(--v-blue-line); box-shadow: 0 6px 0 var(--v-blue-down); }
.tile.yellow { background: var(--v-accent-yellow); border-color: var(--v-yellow-line); box-shadow: 0 6px 0 var(--v-yellow-down); }
.tile.ink { background: var(--v-ink); border-color: var(--v-ink-strong); box-shadow: 0 6px 0 var(--v-ink-strong); }
.tile.red .upgPrice, .tile.blue .upgPrice, .tile.ink .upgPrice { color: #fff; }
.tile.yellow .upgPrice { color: var(--v-ink-strong); }
.tile.red .glyph, .tile.blue .glyph, .tile.yellow .glyph, .tile.ink .glyph { width: 44px; height: 44px; }
.tile.urgent { animation: pulse 1.1s ease infinite; }
.tile.deny { animation: denyShake .4s ease; }

/* --- map above GO, right column, GO the biggest thing on screen --- */
/* --- production GO + map (12.8): a glossy dome with a double ring and a bevelled chevron; the map a blue card above it --- */
#goCol { position: absolute; right: 24px; top: -56px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
#mapBtn {
  width: 96px; height: 96px; border-radius: 28px;
  background: radial-gradient(circle at 50% 24%, #9fdcf2 0, var(--v-accent-blue) 60%);
  box-shadow: 0 7px 0 var(--v-blue-down), 0 12px 18px rgba(0, 0, 0, .14), inset 0 0 0 4px rgba(255, 255, 255, .28);
}
#mapBtn svg { width: 62px; height: 62px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .18)); }
#goBtn {
  width: 180px; height: 180px; border-radius: 50%; border: 8px solid var(--v-green-line);
  background: radial-gradient(circle at 50% 26%, #a6e49a 0, var(--v-accent-green) 58%, #66b558 100%);
  box-shadow: 0 9px 0 var(--v-green-down), 0 16px 24px rgba(0, 0, 0, .18), inset 0 0 0 6px rgba(255, 255, 255, .32), inset 0 -10px 0 rgba(0, 0, 0, .08);
}
#goBtn svg { width: 104px; height: 104px; margin-left: 10px; }
#goBtn:active { box-shadow: 0 3px 0 var(--v-green-down), 0 6px 10px rgba(0, 0, 0, .16), inset 0 0 0 6px rgba(255, 255, 255, .32); transform: translateY(5px); }
#goBtn.locked { background: var(--v-mute); box-shadow: 0 9px 0 var(--v-mute-down), inset 0 0 0 6px rgba(255, 255, 255, .25); }

/* --- grown-ups overlay: the quiet toggle (cream = sound on, putty = quiet) --- */
#quietBtn { width: 96px; height: 96px; }
#quietBtn svg { width: 60px; height: 60px; }
#quietBtn.on { background: var(--v-mute); border-color: var(--v-mute-line); box-shadow: 0 6px 0 var(--v-mute-down); }

/* ============ TITLE SCENE + DAILY GIFT (T17.2, v13.11 landing) ============ */
/* The landing: a wooden sign hangs from two chains with the ZOOMIES wordmark (letters drawn as
   paths, the one word in the game), over a panorama of the twelve worlds. Far band: desert mesas,
   snow peaks with a waterfall, the volcano, the sky kingdom's floating castle. Mid band: the
   construction crane, the rain city, candy-land lollipops, the beach palms. Near bands: fences,
   bushes, cactus, paw signposts and the verge flowers streaming past at road speed. The space
   corner (planet, stars, a rocket) and the balloons drift in the sky. The kid's car sits centred on
   the road, wheels turning, exhaust puffing; the play pill glows at the bottom. Every layer is a
   2400 px strip of two identical 1200 px tiles moved by a transform, scoped to #title.active so
   nothing runs behind the garage, and all of it is off under prefers-reduced-motion. */
#title { background: linear-gradient(#2f9ee9 0%, #6cc4f6 30%, #b9e6fb 52%, #dff3fc 60%); overflow: hidden; }
#titleGround { position: absolute; left: 0; right: 0; top: 330px; bottom: 0; background: linear-gradient(#a5d97f 0%, #8cc968 30%, #6fa85a 100%); }
.tLayer { position: absolute; left: 0; width: 2400px; pointer-events: none; }
.tLayer svg { position: absolute; left: 0; top: 0; width: 1200px; height: 100%; overflow: visible; }
.tLayer svg + svg { left: 1200px; }
#tSky { position: absolute; left: 0; top: 0; width: 1200px; height: 340px; pointer-events: none; }
#tSky svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
#tSky .star { transform-box: fill-box; transform-origin: center; }
#tSky .balloon { transform-box: fill-box; transform-origin: center; }
#tSky .rocket { opacity: 0; }
#tClouds { top: 40px; height: 160px; opacity: .85; }
#tFar { top: 40px; height: 300px; }
#tMid { top: 200px; height: 140px; }
#tHills { top: 296px; height: 164px; }
#tNear { top: 356px; height: 100px; }
#tVerge { top: 598px; height: 102px; }
#tBirds { position: absolute; left: 0; top: 150px; width: 160px; height: 60px; pointer-events: none; opacity: 0; }
#tBirds svg { width: 100%; height: 100%; overflow: visible; }
#tBirds .wing { transform-box: fill-box; transform-origin: center bottom; }
#title.active #tClouds { animation: tScroll 120s linear infinite; }
#title.active #tFar { animation: tScroll 150s linear infinite; }
#title.active #tMid { animation: tScroll 70s linear infinite; }
#title.active #tHills { animation: tScroll 30s linear infinite; }
#title.active #tNear { animation: tScroll 8s linear infinite; }
#title.active #tVerge { animation: tScroll 8s linear infinite; }
#title.active #tBirds { animation: tBird 26s linear 4s infinite; }
#title.active #tBirds .wing { animation: tFlap .42s ease-in-out infinite alternate; }
#title.active #tSky .star { animation: tTwinkle 2.4s ease-in-out infinite; }
#title.active #tSky .balloon { animation: tBalloon 5s ease-in-out infinite; }
#title.active #tSky .rocket { animation: tRocket 18s linear 6s infinite; }
@keyframes tScroll { to { transform: translateX(-1200px); } }
@keyframes tBird { 0% { transform: translate(1260px, 40px); opacity: 0; } 4% { opacity: 1; } 50% { transform: translate(560px, -30px); } 96% { opacity: 1; } 100% { transform: translate(-220px, 20px); opacity: 0; } }
@keyframes tFlap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
@keyframes tBalloon { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-16px) rotate(2deg); } }
@keyframes tRocket { 0% { transform: translate(-80px, 120px) rotate(-30deg); opacity: 0; } 3% { opacity: 1; } 30% { transform: translate(560px, -40px) rotate(-30deg); opacity: 1; } 33%, 100% { transform: translate(640px, -70px) rotate(-30deg); opacity: 0; } }
/* the road: a static slab with a dash strip streaming under the car (one 140 px dash cycle per loop, seamless) */
#titleRoad {
  position: absolute; left: 0; right: 0; top: 450px; height: 150px; overflow: hidden;
  background: #5b5651; border-top: 10px solid #efe6d6; border-bottom: 10px solid #efe6d6;
}
#tDash {
  position: absolute; left: 0; top: 60px; width: 1400px; height: 12px;
  background: repeating-linear-gradient(90deg, #ffd66e 0 70px, transparent 70px 140px);
}
#title.active #tDash { animation: tDash .32s linear infinite; }
@keyframes tDash { to { transform: translateX(-140px); } }
/* the sign: drops in on its chains, swings to rest, then sways; the glint sweeps the wordmark, stars twinkle */
#titleLogo { position: absolute; left: 260px; top: 0; width: 680px; height: 200px; pointer-events: none; z-index: 3; transform-origin: 50% 0; }
#titleLogo svg { width: 100%; height: 100%; overflow: visible; }
#titleLogo .glint { opacity: 0; }
#titleLogo .spark { transform-box: fill-box; transform-origin: center; opacity: 0; }
#titleLogo .leaf { transform-box: fill-box; transform-origin: center; }
#title.active #titleLogo { animation: tDrop .8s cubic-bezier(.2, 1.1, .4, 1) .1s backwards, tSwing 1.8s ease-out .9s, tSway 5s ease-in-out 2.7s infinite; }
#title.active #titleLogo .glint { animation: tGlint 4.2s ease-in-out 1.6s infinite; }
#title.active #titleLogo .spark { animation: tTwinkle 2.1s ease-in-out infinite; }
@keyframes tDrop { 0% { transform: translateY(-320px); } 100% { transform: translateY(0); } }
@keyframes tSwing { 0% { transform: rotate(-5deg); } 30% { transform: rotate(4deg); } 60% { transform: rotate(-2deg); } 85% { transform: rotate(1deg); } 100% { transform: rotate(0); } }
@keyframes tSway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
@keyframes tGlint { 0%, 30% { transform: translateX(-200px); opacity: 0; } 32% { opacity: .5; } 62%, 100% { transform: translateX(760px); opacity: 0; } }
@keyframes tTwinkle { 0%, 100% { transform: scale(.15) rotate(0deg); opacity: 0; } 50% { transform: scale(1) rotate(90deg); opacity: 1; } }
/* the car: centred on the road, drives in from off-stage, wheels turning the whole time it is on the title, exhaust puffing from the tail */
#titleCar { position: absolute; left: 320px; top: 178px; width: 560px; cursor: pointer; touch-action: none; z-index: 4; }
#titleCar svg { width: 100%; height: auto; overflow: visible; position: relative; z-index: 1; }
/* --tGround: the gap from the box's bottom edge to the tire line, measured by placeTitleGround() */
#titleCar .tShadow { position: absolute; left: 24px; right: 24px; bottom: calc(var(--tGround, 40px) - 14px); height: 28px; border-radius: 50%; background: rgba(40, 30, 20, .22); }
#titleCar .tPuffs { position: absolute; left: -6px; bottom: calc(var(--tGround, 40px) + 22px); width: 40px; height: 40px; }
#titleCar .tPuffs span { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: #fff; opacity: 0; }
#titleCar .tPuffs span:nth-child(2) { animation-delay: .45s !important; }
#titleCar .tPuffs span:nth-child(3) { animation-delay: .9s !important; }
#title.active #titleCar { animation: tDrive 1.35s cubic-bezier(.2, .85, .3, 1) .3s backwards; }
#title.active #titleCar .wheelrot { animation: tWheel .5s linear infinite; }
#title.active #titleCar .tPuffs span { animation: tPuff 1.35s ease-out 1.6s infinite; }
#titleCar.idle svg { animation: titleIdle .24s ease-in-out infinite; }
@keyframes titleIdle { 50% { transform: translateY(1.6px); } }
#title.active #titleCar.bounce { animation: tBounce .45s ease; }
#titleCar.blink .vEye { animation: eyeBlink .5s ease; }
@keyframes tDrive { 0% { transform: translateX(-1000px); } 100% { transform: translateX(0); } }
@keyframes tWheel { to { transform: rotate(360deg); } }
@keyframes tPuff { 0% { transform: translate(0, 0) scale(.3); opacity: .6; } 100% { transform: translate(-96px, -54px) scale(1.5); opacity: 0; } }
@keyframes tBounce { 0% { transform: scale(1); } 30% { transform: scale(1.06, .9); } 60% { transform: scale(.96, 1.05); } 100% { transform: scale(1); } }
#titleProfileBtn {
  position: absolute; left: 24px; top: 24px; width: 96px; height: 96px; z-index: 20;
  border-radius: 50%; background: var(--v-surface); border: 6px solid var(--v-surface-line); box-shadow: 0 6px 0 var(--v-surface-down);
}
#titleProfileBtn svg { width: 74px; height: 74px; }
/* PLAY: one huge green pill at the bottom, built like a toy button: a lit top edge, a shaded lower lip, a thick
   base and a ground shadow; it sinks onto its base when pressed. The face is a white play chip and PLAY. */
#titleGo {
  position: absolute; left: 390px; top: 534px; width: 420px; height: 152px; border-radius: 76px; overflow: visible; z-index: 10;
  background: linear-gradient(#9be283 0%, #6fcf5a 45%, #4fb542 100%); border: 10px solid var(--v-green-line);
  box-shadow: 0 10px 0 var(--v-green-down), 0 10px 0 2px rgba(0, 0, 0, .08), 0 18px 0 rgba(0, 0, 0, .16),
    inset 0 5px 0 rgba(255, 255, 255, .45), inset 0 -8px 0 rgba(0, 0, 0, .14);
  transition: transform .08s, box-shadow .08s;
}
#titleGo svg { width: 400px; height: 132px; position: relative; z-index: 1; overflow: visible; }
#titleGo::before { content: ""; position: absolute; inset: -14px; border-radius: 92px; border: 8px solid var(--v-accent-green); opacity: 0; pointer-events: none; }
#titleGo::after { content: ""; position: absolute; left: 6%; top: 7%; width: 88%; height: 26%; border-radius: 50%; background: rgba(255, 255, 255, .22); pointer-events: none; }
#titleGo:active, #titleGo.pressed {
  transform: translateY(8px);
  box-shadow: 0 2px 0 var(--v-green-down), 0 2px 0 2px rgba(0, 0, 0, .08), 0 6px 0 rgba(0, 0, 0, .14), inset 0 3px 0 rgba(255, 255, 255, .3), inset 0 -4px 0 rgba(0, 0, 0, .14);
}
#title.active #titleGo { animation: popIn .5s cubic-bezier(.2, 1.6, .4, 1) 1.4s backwards, tGoPulse 1.7s ease-in-out 1.9s infinite; }
#title.active #titleGo::before { animation: tHalo 1.7s ease-out 1.9s infinite; }
#title.active #titleGo:active, #title.active #titleGo.pressed { animation: none; transform: translateY(8px); }
@keyframes tGoPulse { 50% { transform: scale(1.04); } }
@keyframes tHalo { 0% { transform: scale(.92); opacity: .75; } 100% { transform: scale(1.22); opacity: 0; } }
/* the gift badge: a small capsule riding the play pill's shoulder while today's gift is unclaimed */
#titleGift {
  position: absolute; right: -22px; top: -30px; width: 64px; height: 64px; border-radius: 50%; z-index: 2;
  background: var(--v-surface); border: 5px solid var(--v-yellow-line); box-shadow: 0 4px 0 var(--v-yellow-down);
  display: none; align-items: center; justify-content: center; animation: pulse 1.1s ease infinite;
}
#titleGift.show { display: flex; }
#titleGift svg { width: 38px; height: 42px; }
#title.active #titleProfileBtn { animation: popIn .5s cubic-bezier(.2, 1.6, .4, 1) backwards; }
#title.active #titleUpdateBtn.show { animation: pulse 1.4s ease infinite; }
@media (prefers-reduced-motion: reduce) {
  #title.active #titleLogo, #title.active #titleLogo .glint, #title.active #titleLogo .spark,
  #title.active #titleCar, #title.active #titleCar .wheelrot, #title.active #titleCar .tPuffs span, #titleCar.idle svg, #titleGift,
  #title.active #titleGo, #title.active #titleGo::before, #title.active #titleProfileBtn, #title.active .tLayer,
  #title.active #tSky .star, #title.active #tSky .balloon, #title.active #tSky .rocket,
  #title.active #tBirds, #title.active #tBirds .wing, #title.active #tDash { animation: none !important; }
  #titleLogo .glint { display: none; }
}

/* the daily gift capsule on the garage's right wall, above the dice; pulses until opened */
#giftBtn {
  position: absolute; left: 1042px; top: 192px; width: 88px; height: 88px; z-index: 5; display: none;
  border-radius: 50%; background: var(--v-surface); border: 6px solid var(--v-yellow-line); box-shadow: 0 6px 0 var(--v-yellow-down);
  animation: pulse 1.1s ease infinite;
}
#giftBtn.show { display: flex; }
#giftBtn svg { width: 54px; height: 58px; }
#giftBtn.opening { animation: chipPop .35s ease; }
@media (prefers-reduced-motion: reduce) { #giftBtn { animation: none; } }
/* --- reduced motion: decorative keyframes off (pulses, nudges, pop-ins, confetti, idle bobs, shimmers,
   accessory flutter); the functional ones (scene iris, chip pops, deny shakes, road hits) stay but short --- */
@media (prefers-reduced-motion: reduce) {
  .updateGate, #nextBtn, #replayBtn, #ghostTease, #ghostTease .gTongue, #ghostTease .gWave, #goBtn.nudge, #gasPedal.nudge, .catTab.needs .alert, .tile.urgent, #previewLock, #priceTag:not(.deny),
  .enter, .tile.enter, .tile.justSel.enter, #celebrate.active #resultsCard, #importConfirm.show #importCard, #deleteConfirm.show #deleteCard, #deleteHold.holding .lid, #numCard, #peekCard, #stickerToast.show,
  .confetti, .buddyBob, .buddyPop, .hoverBob, .hoverGlow, .hoverTrail, .spinner, .rearFlame, .flapWing, .boosterFlame, .antennaSway, .bubbleDrift,
  .lavaGlow, .maneWave, .lightFlashA, .lightFlashB, .jetPuff, .discoGlint, .decalShimmer, .decalStomp, .decalSpin, .decalFlicker, .decalTwinkle,
  .decalBeat, .decalCrackle .sparks, .decalPupil, .decalPupilB, .fanBounce, .prop.trophy svg, #preview.blink .vEye, #preview.bounce, #sun.cool,
  .cloud.puffed, .buddySlot.wiggle, .badgeSlot.wiggle, .photoSlot.wiggle, .peekBadge, #celebrateDamage .medal svg, #celebrateTime .medal svg,
  #rotateOverlay svg, #diceBtn.rolling, #title.active #titleLogo, #title.active #titleCar, #title.active #titleGo, #titleCar.idle svg, #titleGift, #giftBtn,
  .prop.ghost, #celebrateTime .ghostWin svg, #celebrateTime.newBest .medal svg { animation: none !important; }
  #iris.go { animation-duration: .2s; }
  .scanLine { animation: none !important; top: 50% !important; opacity: .5; }
  #scanFrame { animation: none !important; }
  #strip, .scene, .tile, .chip, #previewLock, #priceTag { transition-duration: .1s !important; }
}
</style>
</head>
<body>
<div id="stage">

  <!-- title: the boot ceremony. Emblem (a star over a road, no words), the kid's car idling, one huge GO -->
  <div id="title" class="scene">
    <!-- the world panorama: filled by buildTitleWorld() (section 30), far to near -->
    <div id="tSky" aria-hidden="true"></div>
    <div id="tClouds" class="tLayer" aria-hidden="true"></div>
    <div id="tBirds" aria-hidden="true"></div>
    <div id="tFar" class="tLayer" aria-hidden="true"></div>
    <div id="tMid" class="tLayer" aria-hidden="true"></div>
    <div id="titleGround"></div>
    <div id="tHills" class="tLayer" aria-hidden="true"></div>
    <div id="tNear" class="tLayer" aria-hidden="true"></div>
    <div id="titleRoad"><div id="tDash"></div></div>
    <div id="tVerge" class="tLayer" aria-hidden="true"></div>
    <div id="titleLogo" aria-hidden="true"></div>
    <button class="bigBtn" id="titleProfileBtn" aria-label="who is playing"></button>
    <button class="updateGate" id="titleUpdateBtn" aria-label="new version ready: press and hold to update">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff55" stroke-width="8"/>
        <circle class="ring" cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 50 50)"/>
        <g class="arrows" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
          <path d="M30 44 A21 21 0 0 1 68 38"/><path d="M70 56 A21 21 0 0 1 32 62"/>
        </g>
        <path d="M60 30 L72 38 L60 46 Z M40 54 L28 62 L40 70 Z" fill="#fff"/>
      </svg>
    </button>
    <div id="titleCar" aria-label="your car: tap to honk"></div>
    <button class="bigBtn" id="titleGo" aria-label="play: to the garage">
      <!-- the face: a play chip and PLAY drawn as paths (the title's second word, a label on the one button, never <text>) -->
      <svg viewBox="0 0 400 132">
        <circle cx="86" cy="66" r="50" fill="#2f7a2a" opacity=".35"/><circle cx="86" cy="62" r="50" fill="#e9f8e4"/><circle cx="86" cy="62" r="42" fill="#fff"/>
        <path d="M72 38 L112 62 L72 86 Z" fill="#46a63a"/>
        <g transform="translate(152,34) scale(.58)"><g transform="translate(0,0)"><path fill-rule="evenodd" d="M0 0 H52 C76 0 90 14 90 36 C90 58 76 70 52 70 H24 V110 H0 Z M24 22 V48 H50 C58 48 64 44 64 35 C64 26 58 22 50 22 Z" fill="#fff" stroke="#2f7a2a" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/></g><g transform="translate(104,0)"><path d="M0 0 H24 V86 H70 V110 H0 Z" fill="#fff" stroke="#2f7a2a" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/></g><g transform="translate(188,0)"><path fill-rule="evenodd" d="M0 110 L30 0 H58 L88 110 H62 L56 86 H32 L26 110 Z M37 64 H51 L44 34 Z" fill="#fff" stroke="#2f7a2a" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/></g><g transform="translate(290,0)"><path d="M0 0 H28 L44 38 L60 0 H88 L56 64 V110 H32 V64 Z" fill="#fff" stroke="#2f7a2a" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/></g></g>
      </svg>
      <span id="titleGift" aria-label="a gift is waiting"></span>
    </button>
  </div>

  <div id="garage" class="scene active">
    <div id="garageWall"></div>
    <div id="garageFloor"></div>
    <!-- top bar: who is playing (left) | album + star wallet (right); the speaker lives in the grown-ups overlay -->
    <button class="bigBtn" id="profileBtn" aria-label="who is playing"></button>
    <button class="updateGate" id="updateBtn" aria-label="new version ready: press and hold to update">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff55" stroke-width="8"/>
        <circle class="ring" cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 50 50)"/>
        <g class="arrows" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
          <path d="M30 44 A21 21 0 0 1 68 38"/><path d="M70 56 A21 21 0 0 1 32 62"/>
        </g>
        <path d="M60 30 L72 38 L60 46 Z M40 54 L28 62 L40 70 Z" fill="#fff"/>
      </svg>
    </button>
    <button class="bigBtn" id="albumBtn" aria-label="sticker album">
      <svg viewBox="0 0 100 100"><path d="M50 18 Q30 8 14 14 V78 Q30 72 50 82 Q70 72 86 78 V14 Q70 8 50 18 Z" fill="#fff" stroke="#023047" stroke-width="5"/><path d="M50 18 V82" stroke="#023047" stroke-width="4"/><path d="M30 34 L33 41 L41 42 L35 47 L37 55 L30 50 L23 55 L25 47 L19 42 L27 41 Z" fill="#ffd60a"/><circle cx="68" cy="44" r="9" fill="#74c69d"/></svg>
    </button>
    <div class="chip" id="garageWallet" aria-label="star wallet"></div>
    <!-- hero: the car on the workbench floor line; the tag + padlock appear under it for a locked part -->
    <div id="preview"></div>
    <button id="priceTag" aria-label="unlock with stars"></button>
    <div id="previewLock">
      <svg viewBox="0 0 64 64"><rect x="12" y="28" width="40" height="30" rx="7" fill="#ffb703"/><path d="M20 28 V20 a12 12 0 0 1 24 0 V28" stroke="#ffb703" stroke-width="8" fill="none"/></svg>
    </div>
    <!-- right wall: the dice, in one 16px-rhythm column with map + GO; upkeep lives on the workbench tab -->
    <!-- daily gift: a capsule on the right wall above the map, once per calendar day (see section 30) -->
    <button class="bigBtn" id="giftBtn" aria-label="today's gift"></button>
    <!-- extras glyph registry: the content packs append their .extraBtn pictograms here; the extras strip clones them -->
    <div id="extras" hidden aria-hidden="true">
      <button class="bigBtn extraBtn" data-extra="horn" aria-label="horn">
        <svg viewBox="0 0 100 100"><path d="M20 50 Q20 30 45 30 L70 15 L70 85 L45 70 Q20 70 20 50Z" fill="#ffd60a" stroke="#fff" stroke-width="4"/><path d="M80 35 Q92 50 80 65" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg>

  e.hi.frequency.setTargetAtTime(fr * voice.harm, t, 0.07);

  e.hg.gain.setTargetAtTime(voice.high * frac * (0.3 + 0.7 * open), t, 0.1);
  if (e.lfo) e.lfo.frequency.setTargetAtTime(5 + frac * 7 + gear * 2, t, 0.1);
  e.g.gain.setTargetAtTime((v > 5 || gas ? ENGINE_LEVEL : ENGINE_LEVEL * 0.6) * volScale(), t, 0.06);
  /* wind fades in over the top 40% of the speed range */

let svgUid = 0;
function vehicleSVG(st) {
  const B = BODIES[st.body];
  /* wheel-less bodies (tracks, hover ring) own their ground contact: no tires, no wheel lift; hover floats */
  const lift = B.noWheels ? (B.hover || 0) : Math.max(0, WHEELS[st.wheels].r - 26);
  const { paint, defs } = paintDefs(st.color, ++svgUid, "side");   /* flat / rainbow / pattern paint */
  const A = B.anchors;
  const hasBuddy = !!(st.buddy && progress.owned.buddy.includes(st.buddy));
  /* buddy peeks from behind the body unless its anchor says it rides in front (glass cockpits) */
  const buddy = hasBuddy ? `<g transform="${buddyXform(A.buddy)}"><g class="buddyBob">${BUDDY_SVG[st.buddy]}</g></g>` : "";
  const buddyInFront = !!A.buddy[3];
  /* the race number owns the panel centre at NUM_K x the sticker scale; a sticker then shrinks and perches
     on the roundel's upper-front shoulder instead of sharing the middle */
  const hasDecal = !!(st.decal && st.decal !== "none" && DECAL_SVG[st.decal]), hasNum = !!st.number;
  const dk = A.decal[2] ?? 1, NA = A.number;   /* a body with a painted number slot (race) takes the number there instead */
  const nk = NA ? NA[2] : numK(dk), r = 34 * nk;
  const [sx, sy, sk] = hasNum && !NA ? [A.decal[0] + r * 0.9, A.decal[1] - r * 0.6, dk * 0.55] : [A.decal[0], A.decal[1], dk];
  const [nx, ny] = NA || A.decal;
  const decal = (hasDecal ? `<g data-decal="${st.decal}" transform="translate(${sx},${sy}) scale(${sk})">${DECAL_SVG[st.decal]}</g>` : "")
    + (hasNum ? `<g data-number="${st.number}" transform="translate(${nx},${ny}) scale(${nk})">${numberSVG(st.number)}</g>` : "");
  return `<svg viewBox="0 0 320 230" style="--paint:${paint}">
    ${defs}
    <g transform="translate(0,${-lift})"><g class="${B.hover ? "hoverBob" : ""}">
      ${buddyInFront ? "" : buddy}
      ${B.noHood ? "" : hoodToySVG(A.hat)}
      ${B.svg(st)}
      ${buddyInFront ? buddy : ""}
      ${decal}
      ${extrasSVG(st.body, st.extras, hasBuddy)}
      ${shopExtrasSVG(st.body, st.extras, hasBuddy ? A.buddy : null)}
      <g class="mudSpots" style="opacity:${progress.muddy ? 1 : 0}">
        <circle cx="70" cy="160" r="9" fill="#6b4423"/><circle cx="120" cy="170" r="7" fill="#6b4423"/>
        <circle cx="180" cy="165" r="8" fill="#6b4423"/><circle cx="240" cy="158" r="6" fill="#6b4423"/>
      </g>
      <g class="dmgScuff" style="display:${progress.damage >= 1 ? "" : "none"}" stroke="#37474f" stroke-width="3" stroke-linecap="round" opacity=".75">
        <path d="M98 142 l24 -7 M106 150 l18 -5 M188 136 l20 6 M194 145 l14 4" fill="none"/>
        <ellipse cx="150" cy="150" rx="13" ry="7" fill="#00000022" stroke="none"/>
        <g stroke="none" transform="translate(${A.flag[0] + 6},${A.flag[1] - 6}) rotate(-18)">
          <rect x="-16" y="-6" width="32" height="12" rx="6" fill="#e9d8c3"/>
          <rect x="-6" y="-16" width="12" height="32" rx="6" fill="#e9d8c3"/>
          <circle r="3" fill="#c9b697"/>
        </g>
      </g>
      <g class="dmgCrack" style="display:${progress.damage >= 3 ? "" : "none"}" stroke="#f8f9fa" stroke-width="3" fill="none" opacity=".9">
        <path d="M236 98 l-9 9 l11 7 l-7 9 M227 107 l-9 3 M238 114 l10 5"/>
      </g>
      <g class="dmgSmoke" style="display:${progress.damage >= 5 ? "" : "none"}" fill="#90a4ae" transform="translate(${Math.min(288, A.beacon[0] + 60) - 288},0)">
        <circle cx="288" cy="90" r="13" opacity=".85"/>
        <circle cx="296" cy="84" r="10" opacity=".7" style="animation-delay:.45s"/>
        <circle cx="281" cy="81" r="8" opacity=".6" style="animation-delay:.9s"/>
      </g>
      <g class="toyHits">${B.noHood ? "" : `<rect class="hoodHit" x="${A.hat[0] - 32}" y="${A.hat[1] - 36}" width="64" height="48" fill="none"/>`}</g>
    </g></g>
    ${B.noWheels ? "" : wheelSVG(st.wheels, 85) + wheelSVG(st.wheels, 235)}
    <g class="toyHits">${B.noWheels ? "" : [85, 235].map((cx, i) => `<circle class="wheelHit" data-i="${i}" cx="${cx}" cy="${200 - WHEELS[st.wheels].r}" r="${Math.max(WHEELS[st.wheels].r, 24)}" fill="none"/>`).join("")}</g>
  </svg>`;
}
/* GARAGE LIFE (T17.5): the hood toy sits under the body's `hat` roof point, hidden until a tap adds .hoodOpen to the svg
   (see the garage CSS). Hinge at (x, y+10): the painted flap swings up, a cartoon engine block rises out, a sparkle pops.
   Drawn behind the body so only the part above the roofline shows; a body may opt out with `noHood: true`. */
function hoodToySVG([x, y]) {
  return `<g class="hoodToy" transform="translate(${x},${y + 10})">

}

/* ---- extras: 4 more toggles. Placement rule (both views), derived from the existing anchors so
   no body needs new fields (a body MAY override with anchors.spoiler / antenna / surf / bubbles):
     spoiler  -> flag anchor: wing on two struts just forward of the pole foot (x+4..x+40, y-20..y)
     antenna  -> midpoint of beacon and horn, on the roof: 3px pole 40 tall with a red ball
     surf     -> beacon anchor: roof rack 34px tall, board 120 long centred over it
     bubbles  -> booster anchor, 26px above it: machine box on the rear face, bubbles drift back-up
   Mid-tier (12.5):
     jetpack  -> hat anchor: twin tanks 36 tall standing on the roof, a nozzle each side puffing;
                 with a buddy riding the tanks strap on the buddy (flank its head) like the party
                 hat moves to its head, and the party hat perches on top of the tanks otherwise
     trophyrack -> beacon anchor: a 30px roof rack (56 wide, clear of the hat slot) whose rail carries the kid's medals as tiny cups
                 (best five, S gold / A silver / B bronze / C grey); on top of the surf board when both ride */
const JET_H = 36, JET_BUDDY_GAP = 62, SURF_LIFT = 46, TROPHY_MAX = 5;
function jetpackSVG(gap) {
  const h = gap / 2, tank = (cx) => `<rect x="${cx - 7}" y="${-JET_H}" width="14" height="${JET_H - 4}" rx="6" fill="#ced4da" stroke="#023047" stroke-width="2.5"/>

      <g class="jetPuff" style="animation-delay:.45s"><circle cx="${d * (h + 26)}" cy="-8" r="4" fill="#f8f9fa" opacity=".7"/></g>`;

/* side-view anchor resolution for the new extras (see the placement rule above) */
function shopExtraAnchor(A, k) {
  if (A[k]) return A[k];
  if (k === "spoiler") return [A.flag[0], A.flag[1]];
  if (k === "antenna") return [Math.round((A.beacon[0] + A.horn[0]) / 2), Math.min(A.beacon[1], A.horn[1])];
  if (k === "surf" || k === "trophyrack") return [A.beacon[0], A.beacon[1]];
  if (k === "jetpack") return [A.hat[0], A.hat[1]];
  return [A.booster[0], A.booster[1]];   /* bubbles */
}
/* buddyA: the buddy anchor when one rides (the jetpack straps onto it), else null */
function shopExtrasSVG(body, extras, buddyA) {
  const A = BODIES[body].anchors;
  let out = "";
  for (const k in SHOP_EXTRAS_SVG) {
    if (!extras[k]) continue;
    if (k === "jetpack" && buddyA) { out += `<g transform="${buddyXform(buddyA)} translate(32,6)">${jetpackSVG(JET_BUDDY_GAP)}</g>`; continue; }
    const [x, y] = shopExtraAnchor(A, k);
    out += SHOP_EXTRAS_SVG[k](x, k === "trophyrack" && extras.surf ? y - SURF_LIFT : y);
  }
  return out;
}
/* rear view: `at(q, svg, k)` is vehicleRearSVG's projector; N = CAR3D anchors, half = body half-width */
function shopExtrasRear(N, ex, at, half, buddyK) {
  let out = "";
  if (ex.jetpack) out += buddyK ? at(N.buddy, SHOP_EXTRAS_REAR.jetpack(JET_BUDDY_GAP), buddyK) : at(N.jetpack || N.hat, SHOP_EXTRAS_REAR.jetpack(18), 1.2);
  if (ex.trophyrack) out += at(N.trophyrack || N.beacon, `<g transform="translate(0,${ex.surf ? -SURF_LIFT : 0})">${SHOP_EXTRAS_REAR.trophyrack()}</g>`, 1.3);
  if (ex.spoiler) out += at(N.spoiler || [0, N.flag[1], N.flag[2]], SHOP_EXTRAS_REAR.spoiler(half), 1.1);
  if (ex.antenna) out += at(N.antenna || [(N.beacon[0] + N.horn[0]) / 2, Math.min(N.beacon[1], N.horn[1]), (N.beacon[2] + N.horn[2]) / 2], SHOP_EXTRAS_REAR.antenna(), 1.2);
  if (ex.surf) out += at(N.surf || N.beacon, SHOP_EXTRAS_REAR.surf(), 1.3);
  if (ex.bubbles) out += at(N.bubbles || N.booster, SHOP_EXTRAS_REAR.bubbles(), 1.2);
  return out;
}

const preview = document.getElementById("preview");

function lockedParts() {
  const out = [];
  if (!owns("body", state.body)) out.push(["body", state.body]);
  if (!owns("wheels", state.wheels)) out.push(["wheels", state.wheels]);
  if (!owns("color", state.color)) out.push(["color", state.color]);
  if (state.decal !== "none" && !owns("decal", state.decal)) out.push(["decal", state.decal]);
  for (const k in state.extras) if (state.extras[k] && !owns("extras", k)) out.push(["extras", k]);

}
function renderShop() {
  const locked = lockedParts();
  const cost = locked.reduce((s, [k, id]) => s + priceOf(k, id), 0);
  preview.classList.toggle("locked", locked.length > 0);
  document.getElementById("previewLock").classList.toggle("show", locked.length > 0);
  goBtn.classList.toggle("locked", locked.length > 0);
  if (locked.length) {
    priceTag.innerHTML = starIcon + `<span>${cost}</span>`;
    priceTag.classList.add("show");
    priceTag.classList.toggle("afford", progress.wallet >= cost);
  } else priceTag.classList.remove("show");

  if (lastFit && fit !== lastFit) preview.firstElementChild.classList.add("settle");
  lastFit = fit;

  preview.classList.add("bounce");

}

  const cost = locked.reduce((s, [k, id]) => s + priceOf(k, id), 0);
  if (!locked.length) return;
  if (progress.wallet >= cost) {
    progress.wallet -= cost;
    locked.forEach(([k, id]) => progress.owned[k].push(id));

/* ---- GARAGE LIFE (T17.5): idle engine putter + the hood / wheel toys ----
   The putter is a very quiet low square pulse (52 Hz through a 220 Hz lowpass, amplitude wobbled by a 2 Hz LFO)
   on the master bus. It runs only while the garage is the active scene and the tab is visible, starts once audio
   is unlocked, follows quiet mode, and is torn down within a poll tick of any scene change. */
let putter = null, hoodT = null;
const PUTTER_VOL = 0.016, PUTTER_DEPTH = 0.8;
const lifeStats = { hood: 0, spin: 0 };   /* toy counters the life suite reads */
function putterStart() {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  const lfo = actx.createOscillator(), lg = actx.createGain();
  o.type = "square"; o.frequency.value = 52;
  f.type = "lowpass"; f.frequency.value = 220;
  g.gain.value = 0;
  lfo.type = "sine"; lfo.frequency.value = 2; lg.gain.value = 0;
  lfo.connect(lg).connect(g.gain);
  o.connect(f).connect(g).connect(masterBus);
  o.start(); lfo.start();
  putter = { o, f, g, lfo, lg };
}
function putterStop() {
  const t = actx.currentTime, p = putter;
  p.g.gain.cancelScheduledValues(t); p.g.gain.setTargetAtTime(0, t, 0.05);
  p.lg.gain.setTargetAtTime(0, t, 0.05);
  p.o.stop(t + 0.4); p.lfo.stop(t + 0.4);
  putter = null;
}
function putterSync() {
  const want = !!actx && garageEl.classList.contains("active") && !document.hidden;
  if (want && !putter) putterStart();
  else if (!want && putter) putterStop();
  if (putter) {
    const t = actx.currentTime, v = PUTTER_VOL * volScale();
    putter.g.gain.setTargetAtTime(v, t, 0.3);
    putter.lg.gain.setTargetAtTime(v * PUTTER_DEPTH, t, 0.3);
  }
}
setInterval(putterSync, 250);

        if (x < 0 || y < 0 || x >= bm.W || y >= bm.H) continue;
        const c = qrCrossCheck(bm, x, y, QR_ALIGNPAT);
        if (!c || Math.abs(c.m - m) > m * 0.6) continue;
        if (fourths.some(f => Math.abs(f.x - c.x) < m && Math.abs(f.y - c.y) < m)) continue;
        fourths.push({ x: c.x, y: c.y, mod: size - 6.5, d: Math.hypot(c.x - gx, c.y - gy) });
      }
      fourths.sort((a, b) => a.d - b.d).splice(3);
    }
    const [ax, ay] = affine(size - 3.5, size - 3.5);
    fourths.push({ x: ax, y: ay, mod: size - 3.5 });
    for (const f of fourths) {
      const map = qrQuadToQuad([[3.5, 3.5], [size - 3.5, 3.5], [f.mod, f.mod], [3.5, size - 3.5]],
        [[TL.x, TL.y], [TR.x, TR.y], [f.x, f.y], [BL.x, BL.y]]);
      const grid = [];
      for (let r = 0; r < size; r++) {
        const row = new Uint8Array(size);
        for (let c = 0; c < size; c++) {
          const [x, y] = map(c + 0.5, r + 0.5), xi = Math.round(x), yi = Math.round(y);
          row[c] = (xi >= 0 && yi >= 0 && xi < bm.W && yi < bm.H) ? bm.bin[yi * bm.W + xi] : 0;
        }
        grid.push(row);
      }
      const text = qrReadGrid(grid, ver);
      if (text !== null) return text;
    }
  }
  return null;
}

/* ---- the in-app scanner ----
   A save QR scanned with the iPad's camera app opens Safari, whose storage is not the home-screen app's, so
   the import lands in the wrong place. Scanning inside the app keeps it here. BarcodeDetector does the reading
   where the platform really has it (Chrome on Android and macOS); WebKit keeps it behind an experimental flag
   and iOS 18 broke it even with the flag on, so the decoder above reads the frames everywhere else. The
   viewfinder also takes a picture from the photo library (a screenshot of a QR from another device, or a
   camera shot on a device whose camera permission was refused). */
let qrDetectorOK = false, qrDetectorProbed = null;   /* resolved at boot so canScanQR() is accurate by the time a parent opens the overlay */
(async () => {
  try {
    qrDetectorProbed = window.BarcodeDetector || null;
    if (qrDetectorProbed && qrDetectorProbed.getSupportedFormats) qrDetectorOK = (await qrDetectorProbed.getSupportedFormats()).includes("qr_code");
  } catch (e) { qrDetectorOK = false; }
})();
function canScanQR() {
  /* the decoder is always on hand, so the question is only whether a camera can be asked for */
  return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
let scanClose = null, scanPickFile = null;   /* the live scan's handlers; the buttons are wired once */
document.getElementById("scanCloseBtn").addEventListener("pointerdown", () => { sfx.pop(); if (scanClose) scanClose(); });
document.getElementById("scanOverlay").addEventListener("pointerdown", e => { if (e.target === e.currentTarget && scanClose) { sfx.pop(); scanClose(); } });
document.getElementById("scanPick").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f && scanPickFile) scanPickFile(f); });
/* opens the viewfinder, starts the rear camera, reads frames at ~8 Hz; resolves with the raw QR text (a URL or
   a bare code: the caller digs out the VROOM token) after a chime and a green flash, or null on the cross.
   A refused camera shakes the overlay and leaves it open in picture mode, so the picker still works. */
function scanSaveQR() {
  return new Promise(resolve => {
    const ov = document.getElementById("scanOverlay"), video = document.getElementById("scanVideo"), pick = document.getElementById("scanPick");
    const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
    let stream = null, timer = 0, done = false, busy = false, det = null;
    try {
      const BD = window.BarcodeDetector;
      if (BD && (qrDetectorOK || BD !== qrDetectorProbed)) det = new BD({ formats: ["qr_code"] });
    } catch (e) { det = null; }
    const stop = () => {
      clearInterval(timer);
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
    };
    const finish = text => {
      if (done) return;
      done = true; scanClose = null; scanPickFile = null;
      stop();
      ov.classList.remove("show", "noCam", "got", "deny");
      pick.value = "";
      resolve(text);
    };
    const found = text => {
      if (done || ov.classList.contains("got")) return;
      clearInterval(timer);
      ov.classList.add("got");
      sfx.chime();
      setTimeout(() => finish(text), reducedMotion() ? 120 : 380);
    };
    const deny = () => { ov.classList.remove("deny"); void ov.offsetWidth; ov.classList.add("deny"); sfx.deny(); };
    /* src: the video, an ImageBitmap or a canvas; BarcodeDetector first when there is one, then the decoder */
    const decode = async src => {
      if (det) {
        try { const r = await det.detect(src); if (r && r.length && r[0].rawValue) return r[0].rawValue; } catch (e) { det = null; }
      }
      const w = src.videoWidth || src.width, h = src.videoHeight || src.height;
      if (!w || !h) return null;
      const k = Math.min(1, 800 / Math.max(w, h));   /* 800 px on the long side keeps a frame under 10 ms */
      work.width = Math.round(w * k); work.height = Math.round(h * k);
      wctx.drawImage(src, 0, 0, work.width, work.height);
      return qrDecodeImage(wctx.getImageData(0, 0, work.width, work.height));
    };
    scanClose = () => finish(null);
    scanPickFile = async file => {
      let text = null;
      try {
        const bmp = await createImageBitmap(file);
        text = await decode(bmp);
        bmp.close();
      } catch (e) { text = null; }
      pick.value = "";
      if (done) return;
      if (text) found(text); else deny();
    };
    ov.classList.remove("noCam", "got", "deny");
    ov.classList.add("show");
    if (!canScanQR()) { ov.classList.add("noCam"); return; }
    video.muted = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(s => {
        if (done) { s.getTracks().forEach(t => t.stop()); return; }
        stream = s;
        video.srcObject = s;
        const p = video.play(); if (p && p.catch) p.catch(() => {});
        timer = setInterval(async () => {
          if (busy || done || video.readyState < 2) return;
          busy = true;
          try { const t = await decode(video); if (t) found(t); } catch (e) { /* a bad frame: the next one comes in 125 ms */ }
          busy = false;
        }, 125);
      })
      .catch(() => { if (done) return; deny(); ov.classList.add("noCam"); });
  });
}

}

/* ---- the course: curvature along the road (OutRun style) ----

/* ============ 20. ROAD: CHASE-CAM VEHICLE — the build as chunky 3D toy blocks, seen from behind ============ */
/* Each body is boxes / cylinders / hulls in car space (x lateral, y up, z forward from the rear
   bumper), projected through the same camera as the road, so you see the roof, the cab past
   the bed, the hood running off toward the horizon and the front wheels poking out ahead.
   SVG origin = the rear bumper's ground point (stage 600,650); units = stage px at the car.
   Painter's order: far z0 first, then low y0 first. A part resting on another shares its z0
   (split the one underneath otherwise); `late` parts (rails, stacks, horns) draw last. */
/* CAR_K shrinks the whole build in car space (so perspective stays honest): the art is
   authored at full size, the car on the road is half that */
const CAR_K = 0.5;
const VS = z => CAM_D / (z * CAR_K + CAM_D) * CAR_K;   /* px per car-space unit at depth z */
/* vpOff (13.1): the camera's lateral offset from the car in car units while a rear view is composed. In a side
   lane the camera sits inboard of the car, so the inner flank shows and the far end drifts toward the
   vanishing point; the rear-bumper plane is anchored so the sprite's screen position does not move. */
let vpOff = 0;
/* vpYaw (13.3): the car's heading while a view is composed, a rotation of car-space x/z about the vertical axis
   through the rear axle (vpYawZ) before the perspective; + = nose to the right. A lane change yaws the car toward
   its target lane, so the flank on the inside of the turn and the front corner show, then it squares up again. */
let vpYaw = 0, vpYawZ = 0, vpCos = 1, vpSin = 0;
const vrot = (x, z) => vpSin ? [x * vpCos + (z - vpYawZ) * vpSin, vpYawZ + (z - vpYawZ) * vpCos - x * vpSin] : [x, z];
const vp = (x, y, z) => { [x, z] = vrot(x, z); const s = CAM_D / (z * CAR_K + CAM_D); return [(x + vpOff) * CAR_K * s - vpOff * CAR_K, (CAM_H - y * CAR_K) * s - CAM_H]; };
const vsAt = (x, z) => VS(vrot(x, z)[1]);   /* px per car unit at a point's real depth, heading included */
/* a vertical face through (x, z) with outward normal (nx, nz) shows when the camera (x = -vpOff, far behind the
   bumper) sits on its outer side; the normal turns with the heading like the point does */
const faceVis = (x, z, nx, nz = 0) => { const [px, pz] = vrot(x, z); return (-vpOff - px) * (nx * vpCos + nz * vpSin) + (-CAM_D / CAR_K - pz) * (nz * vpCos - nx * vpSin) > 0; };
const fx = n => n.toFixed(1);
const ptStr = a => a.map(p => fx(p[0]) + "," + fx(p[1])).join(" ");
const vpoly = (pts, fill, extra = "") => `<polygon points="${ptStr(pts)}" fill="${fill}" stroke-linejoin="round" ${extra}/>`;
function hull2(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
/* a ring around the z axis (cylinder end) and one in the ground plane (saucer/dome slice) */
const ringZ = (cx, cy, r, z) => [...Array(20)].map((_, i) => [cx + r * Math.cos(i * Math.PI / 10), cy + r * Math.sin(i * Math.PI / 10), z]);
const ringY = (y, R, zc) => [...Array(24)].map((_, i) => [R * Math.cos(i * Math.PI / 12), y, zc + R * Math.sin(i * Math.PI / 12)]);

const VP = "var(--paint)", VG = "#bde0fe", VD = "#495057", VM = "#6c757d", VK = "#343a40", VR = "#e63946";
/* part constructors */
const box = (x0, x1, y0, y1, z0, z1, fill, o = {}) => ({ k: "box", x0, x1, y0, y1, z0, z1, y1f: o.y1f ?? y1, fill, ...o });
const cbox = (w, y0, y1, z0, z1, fill, o) => box(-w, w, y0, y1, z0, z1, fill, o);
const cyl = (yb, rb, z0, yf, rf, z1, fill, o = {}) => ({ k: "cyl", x: 0, yb, rb, z0, yf, rf, z1, y0: yb - rb, fill, ...o });
const hullP = (rings, fill, o = {}) => ({ k: "hull", rings, fill, z0: o.z0 ?? 0, y0: o.y0 ?? 0, ...o });
const spr = (x, y, z, svg, sc = 1, o = {}) => ({ k: "spr", x, y, z, svg, sc, z0: z, y0: y, ...o });
const poly3 = (pts, fill, o = {}) => ({ k: "poly3", pts, fill, z0: o.z0 ?? Math.min(...pts.map(q => q[2])), y0: o.y0 ?? Math.min(...pts.map(q => q[1])), ...o });
/* rocket fin: a thin swept blade radiating from the fuselage at angle a (deg, 0 = right, 90 = up) */
function rocketFin(a) {
  const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180), cy = 112;
  const P = (r, z, t) => [c * r - s * t, cy + s * r + c * t, z];
  return hullP([[P(64, 16, -6), P(64, 16, 6), P(64, 170, -4), P(64, 170, 4), P(150, 24, -5), P(150, 24, 5), P(150, 70, -4), P(150, 70, 4)]],
    VP, { z0: 15, y0: 0, shade: .12, edge: true });
}

function dragonWing(side) {
  const X = q => [q[0] * side, q[1], q[2]];
  const root1 = [92, 140, 230], tip = [262, 268, 130], s1 = [230, 196, 66], m1 = [196, 214, 92], s2 = [168, 170, 46], m2 = [140, 182, 64], root2 = [92, 140, 40];
  return poly3([root1, tip, s1, m1, s2, m2, root2].map(X), VP, { z0: 39, lite: .16,
    bones: [[root1, tip], [[100, 146, 150], s1], [[100, 146, 120], s2]].map(b => b.map(X)) });

/* ---- level runtime ---- */
let level = 1, lastPlayed = 1, freeMode = false, paradeMode = false;
const PARADE_LEVEL = MAX_LEVEL + 1;
function paradeUnlocked() {
  for (let n = 1; n <= MAX_LEVEL; n++) if (!progress.levels[n]) return false;
  return true;
}
let LEVEL_LEN = 5200, RAMPS = [], props = [], scenery = [], totalStars = 0, runStars = 0, runDamage = 0, runTime = 0;
let freeSpawnX = 0, freeThemeIdx = 0, freeSceneryX = 0, freeCourseX = 0;

/* a ramp is {x, w, h, tail} plus optional kick (launch speed share, default 0.9) and deck colors */
function rampOn(x) {
  for (const rp of RAMPS) { const d = x - rp.x; if (d >= 0 && d <= rp.w) return rp; }
  return null;
}
function rampElev(x) { const rp = rampOn(x); return rp ? (x - rp.x) / rp.w * rp.h : 0; }
/* the ramp whose lip the car just left (the one launch rule reads it) */
function rampBehind(x) {
  let best = null;
  for (const rp of RAMPS) if (rp.x + rp.w <= x && (!best || rp.x > best.x)) best = rp;
  return best;
}
/* the one launch rule: leave the lip at the deck's height, rising at a share of the speed */
function rampLaunch(rp, speed) { return { y: rp ? rp.h : 95, vy: Math.min(speed, rp && rp.cap || Infinity) * (rp && rp.kick || 0.9) }; }

/* a sprite: an outer .sprite wrapper the projector moves/scales (anchor = its 0,0),
   holding the .prop element whose own transforms/animations stay free for gags */
function makeSprite(type, x, lx, h, svg, xOff, yOff, k, fw) {
  const wrap = document.createElement("div");
  wrap.className = "sprite";
  const el = document.createElement("div");
  el.className = "prop " + type;
  el.innerHTML = svg;
  el.style.cssText = `left:${xOff}px; top:${yOff}px;`;
  const p = { type, x, lx, h, el, wrap, k: k || 1, done: false, vis: false, zi: 0, shd: null, hz: null, hzs: 0 };
  /* ---- blob shadow (13.3): props used to float a pixel off the ground; the car alone had a footprint.
     Width comes from the per-type table, else the art's own footprint (centred art hangs at xOff = -w/2),
     else what the caller passed (scenery pieces know their width). Straight down, no sun offset, like the car's. */
  const w0 = fw !== undefined ? fw : SHADOW_W[type] !== undefined ? SHADOW_W[type] : xOff < 0 ? -2 * xOff : 0;
  if (w0 > 0 && !NO_SHADOW.has(type)) {
    /* something in the air throws a smaller, fainter blob; flyers barely mark the ground */
    const sh = FLY_PROPS.has(type) ? 0.35 : Math.max(0.3, 1 - h / 400);
    const W = w0 * 1.1 * (0.55 + 0.45 * sh), H = W * 0.36;
    const s = document.createElement("div");
    s.className = "shd";
    /* the wrapper's 0,0 is the sprite's own point, h above the ground: the blob sits at local y = h, nudged back so
       more of it reads as behind the base than in front */
    s.style.cssText = `left:${(xOff + w0 / 2 - W / 2).toFixed(1)}px; top:${(h - H * 0.6).toFixed(1)}px; width:${W.toFixed(1)}px; height:${H.toFixed(1)}px; opacity:${(0.26 * sh).toFixed(2)};`;
    wrap.appendChild(s);
    p.shd = s;
  }
  wrap.appendChild(el);
  /* ---- atmospheric haze (13.3): a haze-coloured silhouette over the art, see placeSprite for the fade ---- */
  if (type !== "ghost") {
    const z = document.createElement("div");
    z.className = "hz " + hazeMaskClass(svg);
    el.appendChild(z);
    p.hz = z;
  }
  worldEl.appendChild(wrap);
  return p;
}
/* shadow footprint widths in the art's own px; anything missing uses its centred art width (see makeSprite) */
const SHADOW_W = { cone: 46, barrel: 60, rock: 80, tnt: 62, capsule: 60, star: 40, napdino: 180 };
const NO_SHADOW = new Set(["puddle", "oil", "ice", "finish", "fan", "trophy", "ghost"]);
const FLY_PROPS = new Set(["kite", "thundercloud", "jellyfish"]);
/* HAZE METHOD. Three ways were weighed to tint only a sprite's drawn pixels toward the horizon colour:
   (1) a CSS filter per sprite (feFlood + feComposite): tints correctly, but it is a filter pass re-run on
       every repaint of every far sprite, and the task rules out per-frame filter work;
   (2) a haze-coloured overlay with mix-blend-mode: no masking, so it tints the whole bounding box (wrong);
   (3) a haze-coloured div masked by the sprite's own SVG (chosen): the mask is the same SVG string as the art,
       served as a data: URL from a stylesheet class shared by every sprite with that art, so Chromium decodes
       it once per distinct piece and rasterizes it with the sprite's layer. Nothing is recomputed per frame:
       the only per-frame write is the overlay's opacity, and only when the quantized step changes (HAZE_STEPS
       steps between 35% of DRAW_FAR and DRAW_FAR), the same discipline as p.op. Cost, measured on level 80
       with Chromium's frame-rate limit off: the unthrottled median moved by under 1 ms against the build
       without it, inside the run-to-run noise; the suite's 17 ms level-80 median check is unaffected.
   What it does not do: an SVG gag that animates inside the art (a bobbing jellyfish, a swooping kite) is
   tinted by its resting pose, since the mask is the static string; at 0.45 max opacity it does not read. */
const hazeMasks = new Map();
let hazeStyle = null;
function hazeMaskClass(svg) {
  let cls = hazeMasks.get(svg);
  if (cls) return cls;
  cls = "hzm" + hazeMasks.size;
  hazeMasks.set(svg, cls);
  if (!hazeStyle) { hazeStyle = document.createElement("style"); document.head.appendChild(hazeStyle); }
  /* inline SVG needs no namespace; an SVG image does */
  const src = svg.replace(/<svg(?![^>]*xmlns=)/, '<svg xmlns="http://www.w3.org/2000/svg"');
  const url = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(src)}")`;
  hazeStyle.sheet.insertRule(`.hz.${cls} { -webkit-mask-image: ${url}; mask-image: ${url}; }`, hazeStyle.sheet.cssRules.length);
  return cls;
}
const HAZE_START = 0.35, HAZE_MAX = 0.45, HAZE_STEPS = 9;   /* fade-in from 35% of DRAW_FAR to 0.45 at DRAW_FAR, in 0.05 steps */
function addProp(type, x, lane, h, svg, xOff, yOff) {
  const p = makeSprite(type, x, laneX(lane), h, svg, xOff, yOff);
  p.lane = lane;
  p.y = 585 - h;   /* screen-ish height kept for the test suites (a low star reads as y > 400) */
  props.push(p);
  return p;
}
function clearWorld() {
  for (const p of props) p.wrap.remove();
  for (const p of scenery) p.wrap.remove();
  props = []; scenery = []; RAMPS = []; TWISTS = []; totalStars = 0;
}

/* ---- BEAT SEQUENCER: a level is a seeded sequence of formations ----
   Every level has a signature beat (repeated with variations) plus 1-2 contrasting
   beats and breathers, so level 7 feels like "the snake-trail level" and level 8 like
   "the barrel-bowling level". Beats read curvAt(x) so star trails hug the inside of a
   bend and obstacles crowd the outside. Required ingredients (puddles, capsules, oil,
   tnt, world hazards) and the hard/star budgets are guaranteed by passes at the end. */
const BEATS = {};
function defBeat(name, kind, minLvl, fn) { BEATS[name] = { name, kind, minLvl, fn }; }
/* hard obstacle / star / level budgets (tests pin the ordering L5 <= L15 <= L30) */
const minHard = n => n < 3 ? 0 : Math.floor(1 + Math.min(n, 50) * 0.3);   /* past level 50 the formations, not random fills, bring the hazards */
const maxHard = n => n < 3 ? 0 : Math.floor(2 + n * 0.45);
const minStars = n => 12 + Math.floor(Math.min(n, 45) / 2);
const maxStars = n => 22 + Math.floor(n * 1.2);
const HARD_T = t => t === "barrel" || t === "rock" || t === "tnt" || !!(EXTRA_PROPS[t] && EXTRA_PROPS[t].hard);
const SOFT_T = t => t === "cone" || !!(EXTRA_PROPS[t] && !EXTRA_PROPS[t].hard && t !== "ice");
const BLOCKER_T = t => HARD_T(t) || SOFT_T(t) || t === "oil" || t === "ice" || t === "puddle" || t === "capsule";

/* ---- star trails ---- */
defBeat("trailStraight", "star", 1, (b, x) => {
  const lane = b.pickLane(x), k = b.S + Math.floor(b.rng() * 3);
  for (let i = 0; i < k; i++) b.star(x + i * 115, lane);
  return x + k * 115;
});
defBeat("snake", "star", 1, (b, x) => {
  const k = b.S + 2 + Math.floor(b.rng() * 3), dir = b.rng() < 0.5 ? 1 : -1;
  let lane = dir > 0 ? 0 : 2, d = dir;
  for (let i = 0; i < k; i++) {
    b.star(x + i * 135, lane);
    if (lane + d < 0 || lane + d > 2) d = -d;
    lane += d;
  }
  return x + k * 135;
});
defBeat("rainbow", "star", 1, (b, x) => {
  const seq = b.rng() < 0.5 ? [0, 1, 2, 1, 0, 1, 2, 1, 0] : [2, 1, 0, 1, 2, 1, 0, 1, 2];
  const k = Math.min(seq.length, b.S + 3);
  for (let i = 0; i < k; i++) b.star(x + i * 120, seq[i]);
  return x + k * 120;
});
defBeat("arc", "star", 3, (b, x) => {   /* hugs the inside of the bend, drifts with it */
  const k = b.S + 3;
  for (let i = 0; i < k; i++) { const sx = x + i * 125; b.star(sx, b.inside(sx)); }
  /* a cone on the outside halfway: the bend pushes you in */
  if (b.n >= 2) b.put(b.soft(), x + Math.floor(k / 2) * 125, b.outside(x + Math.floor(k / 2) * 125));
  return x + k * 125;
});
defBeat("doubleRow", "star", 1, (b, x) => {
  const skip = Math.floor(b.rng() * 3), lanes = [0, 1, 2].filter(l => l !== skip), k = 3 + Math.floor(b.S / 2);
  for (let i = 0; i < k; i++) for (const l of lanes) b.star(x + i * 130, l);
  if (b.n >= 2) b.put(b.soft(), x + Math.floor(k / 2) * 130, skip);
  return x + k * 130;
});
defBeat("starGate", "star", 3, (b, x) => {   /* two lanes of stars, one lane blocked */
  const cols = 2 + Math.floor(b.rng() * 2);
  for (let c = 0; c < cols; c++) {
    const gx = x + c * 320, blk = b.rng() < 0.6 ? b.outside(gx) : Math.floor(b.rng() * 3);
    for (let l = 0; l < 3; l++) l === blk ? b.put(b.hardOrSoft(), gx, l) : b.star(gx, l);
    b.star(gx + 130, b.rng() < 0.5 ? (blk + 1) % 3 : (blk + 2) % 3);
  }
  return x + cols * 320;
});
defBeat("starShower", "star", 6, (b, x) => {   /* a confetti burst of stars, every lane */
  const cols = 3 + Math.floor(b.rng() * 2);
  for (let c = 0; c < cols; c++) for (let l = 0; l < 3; l++) b.star(x + c * 120 + (l === 1 ? 60 : 0), l);
  return x + cols * 120 + 60;
});
defBeat("stairway", "star", 1, (b, x) => {   /* zig low stars climbing lane by lane toward a bend */
  const k = b.S + 2, up = b.inside(x + k * 60) === 2;
  for (let i = 0; i < k; i++) b.star(x + i * 120, up ? Math.min(2, Math.floor(i / 2)) : Math.max(0, 2 - Math.floor(i / 2)));
  return x + k * 120;
});

/* ---- obstacle shapes ---- */
defBeat("slalom", "obs", 2, (b, x) => {
  const k = 3 + Math.floor(b.d * 4), lanes = b.rng() < 0.5 ? [0, 2] : [2, 0];
  for (let i = 0; i < k; i++) {
    const ox = x + i * 270, l = lanes[i % 2];
    b.put(b.hardOrSoft(), ox, l);
    b.star(ox + 135, 2 - l);         /* the hint: the star sits where you should be */
    if (i % 2 === 0) b.star(ox + 135, 1);   /* the middle lane is safe all the way through */
  }
  return x + k * 270;
});
defBeat("gate", "obs", 5, (b, x) => {   /* two lanes shut, one open with a star */
  const gates = 1 + Math.floor(b.d * 2.5);
  let open = -1;
  for (let g = 0; g < gates; g++) {
    const gx = x + g * 560;   /* a breath between gates: one decision per 0.8s at full speed */
    let want = b.rng() < 0.5 ? b.inside(gx) : Math.floor(b.rng() * 3);
    want = open < 0 ? b.nearLane(want) : Math.abs(want - open) > 1 ? open + Math.sign(want - open) : want;   /* never two lanes over at once */
    open = want;
    for (let l = 0; l < 3; l++) if (l !== open) b.put(g === 0 || b.rng() < 0.6 ? b.hard() : b.soft(), gx, l);
    b.star(gx - 200, open); b.star(gx, open); b.star(gx + 120, open);   /* the lead-in star shows the way through */
  }
  return x + gates * 560;
});
defBeat("closingWalls", "obs", 8, (b, x) => {   /* the open lane walks across the road */
  let open = b.nearLane(Math.floor(b.rng() * 3));
  const dir = open === 0 ? 1 : open === 2 ? -1 : (b.rng() < 0.5 ? 1 : -1), k = 3;
  for (let g = 0; g < k; g++) {
    const gx = x + g * 430;   /* one lane step per 430 units: small hands can follow it */
    for (let l = 0; l < 3; l++) if (l !== open) b.put(l === (open + dir + 3) % 3 || b.rng() < 0.5 ? b.hard() : b.soft(), gx, l);
    b.star(gx, open);
    open = Math.max(0, Math.min(2, open + dir));
  }
  return x + k * 430;
});
defBeat("coneForest", "obs", 1, (b, x) => {   /* soft and silly: cones everywhere, stars between */
  const cols = 4 + Math.floor(b.rng() * 3);
  for (let c = 0; c < cols; c++) {
    const cx = x + c * 170, free = Math.floor(b.rng() * 3), other = [0, 1, 2].filter(l => l !== free);
    const i = Math.floor(b.rng() * 2);
    b.put(b.soft(), cx, other[i]);
    if (b.rng() < 0.5) b.put(b.soft(), cx, other[1 - i]);
    if (c % 2 === 1) b.star(cx, free);
  }
  return x + cols * 170;
});
defBeat("bowling", "obs", 3, (b, x) => {   /* barrels in a V, the star sits at the tip */
  const flip = b.rng() < 0.5;
  const L = l => flip ? 2 - l : l;
  b.put(b.hardOrSoft(), x, L(0));
  b.star(x, L(2)); b.star(x + 130, L(1));
  b.put(b.hardOrSoft(), x + 270, L(0)); b.put(b.hardOrSoft(), x + 270, L(2));
  b.star(x + 400, L(1)); b.star(x + 530, L(1));
  b.put(b.hardOrSoft(), x + 540, L(2)); b.put(b.hardOrSoft(), x + 540, L(0));
  b.star(x + 670, L(1));
  return x + 700;
});
defBeat("minefield", "obs", 12, (b, x) => {   /* sparse tnt, stars mark the safe lane */
  const cols = 3 + Math.floor(b.d * 2);
  let safe = b.nearLane(b.rng() < 0.4 ? 1 : Math.floor(b.rng() * 3));
  for (let c = 0; c < cols; c++) {
    const cx = x + c * 330;
    b.put("tnt", cx, (safe + 1 + Math.floor(b.rng() * 2)) % 3);
    b.star(cx, safe); b.star(cx + 165, safe);
    if (b.rng() < 0.5) safe = Math.max(0, Math.min(2, safe + (b.rng() < 0.5 ? 1 : -1)));   /* one lane step per column */
  }
  return x + cols * 330;
});
defBeat("capsuleAlley", "rhythm", 3, (b, x) => {   /* a capsule flanked by cones, stars lead in */
  const lane = b.pickLane(x);
  b.star(x, lane); b.star(x + 120, lane);
  b.capsule(x + 300, lane);
  for (let l = 0; l < 3; l++) if (l !== lane) b.put(b.soft(), x + 300, l);
  b.star(x + 450, lane);
  return x + 500;
});
defBeat("puddleParty", "rhythm", 2, (b, x) => {   /* splash through every lane, then stars */
  const order = b.rng() < 0.5 ? [0, 1, 2] : [2, 1, 0];
  for (let i = 0; i < 3; i++) b.put("puddle", x + i * 160, order[i]);
  for (let i = 0; i < 3; i++) b.star(x + 560 + i * 115, order[2]);
  return x + 560 + 3 * 115;
});
defBeat("oilSlalom", "rhythm", 5, (b, x) => {   /* slick lanes alternate, stars on the dry side */
  const k = 2 + Math.floor(b.d * 2), a = Math.floor(b.rng() * 3);
  for (let i = 0; i < k; i++) {
    const ox = x + i * 300, l = (a + i) % 3;
    b.put(b.slick(), ox, l);
    b.star(ox + 60, (l + 1) % 3); b.star(ox + 180, (l + 1) % 3);
  }
  return x + k * 300;
});
defBeat("breather", "rhythm", 1, (b, x) => {   /* empty road to breathe, maybe one lonely star */
  const L = 400 + Math.floor(b.rng() * 300);
  if (b.rng() < 0.5) b.star(x + L / 2, b.pickLane(x + L / 2));
  return x + L;
});

/* ---- ramp beats: every ramp pushes {x, w:250, h:95, tail} into RAMPS and leaves a high star
   on the jump arc at rx+460. A full-throttle launch off the lip (rx+250) lands ~680 units
   later on earth and ~1480 on the moon (gravity 640), so the ground stays clear of items
   until rx + flightLen, and world 8 strings its high stars along the whole float. ---- */
const FLIGHT_EARTH = 950, FLIGHT_MOON = 1850;
const G_EARTH = 1900, G_MOON = 640;   /* 13.0: earth-type worlds pull harder (was 1500); the moon, the sea and the sky float */
const flightLen = w => {   /* follows the world's gravity: earth 950, moon 1850, anything between interpolates */
  const g = worldMeta(w).gravity;

  if (n >= 5 && !count(p => p.type === "barrel" || p.type === "rock")) spotFor("barrel");
  if (n >= 12 && !count(p => p.type === "tnt")) { const bp = props.find(p => p.type === "barrel"); if (bp) { const bx = bp.x, bl = bp.lane; removeProp(bp); addItem("tnt", bx, bl); } else spotFor("tnt"); }
  if (WORLD_ITEMS[w]) for (const t of WORLD_ITEMS[w]) if (!count(p => p.type === t)) spotFor(t);
  while (count(p => p.type === "capsule") > 2) { const c = props.filter(p => p.type === "capsule").pop(); const cx = c.x, cl = c.lane; removeProp(c); addItem("star", cx, cl); }
  /* hard budget: demote extras to cones, promote cones to barrels when short */
  let hardPs = () => props.filter(p => HARD_T(p.type));
  const shuffled = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  for (const p of shuffled(hardPs())) {
    if (hardPs().length <= maxHard(n)) break;
    if (p.type === "tnt" && count(q => q.type === "tnt") <= 1) continue;
    if ((p.type === "barrel" || p.type === "rock") && count(q => q.type === "barrel" || q.type === "rock") <= 1) continue;
    if (WORLD_ITEMS[w] && WORLD_ITEMS[w].includes(p.type) && count(q => q.type === p.type) <= 1) continue;
    const px = p.x, pl = p.lane; removeProp(p); addItem("cone", px, pl);
  }
  for (const p of shuffled(props.filter(p => p.type === "cone"))) {
    if (hardPs().length >= minHard(n)) break;
    const s = hardLanesNear(p.x); s.add(p.lane); if (s.size >= 3) continue;
    if (props.some(q => q.type === "star" && Math.abs(q.x - p.x) < 200 && q.lane === p.lane)) continue;   /* a cone in a star trail stays a cone */
    const px = p.x, pl = p.lane; removeProp(p); addItem(n >= 8 && rng() < 0.4 ? "rock" : "barrel", px, pl);
  }
  while (hardPs().length < minHard(n) && spotFor("barrel"));
  /* barrels and rocks stay the backbone even on a tnt-heavy level */
  const isBR = p => p.type === "barrel" || p.type === "rock";
  while (count(isBR) < Math.ceil(minHard(n) / 2)) {
    const t = count(q => q.type === "tnt") > 1 ? props.find(p => p.type === "tnt") : null;
    const c = t || props.find(p => p.type === "cone" && !hardLanesNear(p.x).has(p.lane) && hardLanesNear(p.x).size < 2);
    if (!c) { if (!spotFor("barrel")) break; continue; }
    const px = c.x, pl = c.lane; removeProp(c); addItem("barrel", px, pl);
  }
  /* star budget: floors climb with the level, ceilings keep the early levels readable */
  while (count(p => p.type === "star") < minStars(n) && spotFor("star"));
  /* early roads: a fifth of the stars sit in the middle lane, so gas-only toddlers still score */
  if (n <= 20) while (count(p => p.type === "star" && p.lane === 1) < 0.2 * count(p => p.type === "star") && spotFor("star", 1));
  const lowStars = props.filter(p => p.type === "star" && p.h === LOW_STAR_H);
  for (let i = lowStars.length - 1; i >= 0 && count(p => p.type === "star") > maxStars(n); i--) removeProp(lowStars[i]);

  addProp("finish", LEVEL_LEN, 1, 0, finishSVG, -400, -380);
  eventDressLevel(n);   /* SURPRISE EVENTS: the sleeping dino on its day (after every budget pass, never counted) */
  lastBeats = beats;

  buildScenery(LEVEL_LEN + 1600, w, n);
  applyTheme(w);
  scheduleEvents(n, w);   /* seeded live sky events for this level */
}
/* one road item on the ground of a lane (stars float at belly height) */
function addItem(t, x, lane) {
  if (t === "cone")    addProp(t, x, lane, 0, coneSVG, -32, -78);
  if (t === "capsule") addProp(t, x, lane, 0, capsuleSVG, -35, -74);
  if (t === "oil")     addProp(t, x, lane, 0, oilSVG, -75, -36);
  if (t === "tnt")     addProp(t, x, lane, 0, tntSVG, -35, -68);
  if (t === "barrel")  addProp(t, x, lane, 0, barrelSVG, -33, -82);
  if (t === "rock")    addProp(t, x, lane, 0, rockSVG, -42, -64);
  if (t === "puddle")  addProp(t, x, lane, 0, puddleSVG, -115, -52);
  if (t === "star") { addProp(t, x, lane, LOW_STAR_H, starSVG, -32, -32); totalStars++; }
  if (EXTRA_PROPS[t]) addWorldProp(t, x, lane);
}

/* ---- world plumbing: themes, weather, movers ---- */
function addWorldProp(t, x, lane) {
  const ep = EXTRA_PROPS[t];

}

function tickMovers(dt) {
  for (const p of props) {

    if (p.mv.vx) {   /* tumbleweed: rolls down the road toward the car */

      p.mvSpin = (p.mvSpin || 0) - dt * 260;
      p.el.style.transform = `rotate(${p.mvSpin}deg)`;
    }
    if (p.mv.laneHop) {   /* crab: scuttles sideways between lanes */
      p.mvT = (p.mvT || 0) + dt;
      if (p.mvT >= p.mv.laneHop) {
        p.mvT = 0;

        p.lane += p.mvDir;

      p.lx += (laneX(p.lane) - p.lx) * Math.min(1, dt * 8);

  }

const SCENERY_STEP = 450;
/* a ramp lip hides the ground ~900 units behind it from the low chase cam, so an arch
   just past a ramp looks like it grows out of the deck: keep them well clear */
const inArchZone = x => RAMPS.some(rp => x > rp.x - 300 && x < rp.x + rp.w + Math.max(1000, rp.tail || 0)) || inTwist(x, 700);
/* hard-turn boards: red with white chevrons pointing the way the road goes, on the outside of the turn */
const chevronSVG = right => `<svg width="96" height="150" viewBox="0 0 96 150"><rect x="42" y="70" width="12" height="80" rx="4" fill="#6c757d"/>` +
  `<rect x="4" y="4" width="88" height="76" rx="12" fill="#e63946" stroke="#f1faee" stroke-width="6"/>` +
  `<g transform="${right ? "" : "translate(96,0) scale(-1,1)"}"><path d="M22 20 L44 42 L22 64 M48 20 L70 42 L48 64" stroke="#f1faee" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
function addChevrons() {
  const hard = COURSE.filter(c => c.hard).sort((a, b) => a.x0 - b.x0);
  hard.forEach((c, i) => {
    const right = c.k > 0, side = right ? -1 : 1;   /* a right-hander's outside is the left verge */
    /* kinks close together split the road between them at the midpoint, so every board stands nearest its own turn */
    const lo = i ? Math.max(c.x0 - 260, (hard[i - 1].x1 + c.x0) / 2 + 1) : c.x0 - 260;
    const hi = i < hard.length - 1 ? Math.min(c.x1 + 40, (c.x1 + hard[i + 1].x0) / 2 - 1) : c.x1 + 40;
    for (let x = lo; x <= hi; x += 150) {
      const p = makeSprite("scenery", x, side * (ROAD_HALF + 70), 0, chevronSVG(right), side < 0 ? -96 : 0, -150, 1.1, 96);
      p.chevron = true;
      scenery.push(p);
    }
  });
}
let scPool = null, scArch = null, scLast = [-1, -1], freeArchX = 0;
function addScenery(x, side, r = Math.random) {
  const pool = scPool || WORLD_SET.w1, si = side < 0 ? 0 : 1;
  /* never the same piece twice in a row on one side */
  let i = Math.floor(r() * pool.length);
  if (pool.length > 1 && i === scLast[si]) i = (i + 1 + Math.floor(r() * (pool.length - 1))) % pool.length;
  scLast[si] = i;
  const pz = pool[i];
  const lx = side < 0 ? -(ROAD_HALF + 80 + pz.back) : ROAD_HALF + 80 + pz.back;
  /* left-side pieces hang off their right edge so nothing ever overlaps the road */
  const p = makeSprite("scenery", x, lx, 0, pz.svg, side < 0 ? -pz.w : 0, pz.yOff, pz.k, pz.w);
  scenery.push(p);
}
/* a structure over the road: wide art anchored at lane center, like the finish gantry */
function addArch(x) {
  const a = scArch;
  if (!a) return;
  const p = makeSprite("scenery", x, 0, 0, a.svg, -a.w / 2, -a.h, 1, 0);   /* no blob: an arch spans the road on two legs */
  p.arch = true;
  scenery.push(p);
}
function buildScenery(len, world = 1, seed = 0) {
  const key = typeof world === "number" ? "w" + world : world;
  const farFn = WORLD_FAR[key];
  const lmFn = WORLD_LANDMARK[key];
  scPool = WORLD_SET[key] || WORLD_SET.w1;
  scArch = WORLD_ARCH[key] || null;
  scLast = [-1, -1];
  let far = "";
  for (let x = 0; x < 1200; x += 520) {   /* 1200 isn't a 520 multiple: hills overlap the seam harmlessly */
    far += farFn ? farFn(x)
      : `<path d="M${x} 465 Q${x + 130} 300 ${x + 260} 465 Q${x + 390} 320 ${x + 520} 465" fill="#7fcaa8"/>`;
  }
  if (lmFn) far += lmFn(0);   /* the strip below is drawn 3x, so one landmark per tile tiles cleanly */
  /* squash the old 165px-tall skyline onto the horizon */
  /* three copies side by side so the heading-driven parallax can wrap seamlessly */
  farLayer.innerHTML = `<svg width="3600" height="700" viewBox="0 0 3600 700" style="overflow:visible"><g transform="translate(0,${HORIZON}) scale(1,.55) translate(0,-465)">${far}<g transform="translate(1200,0)">${far}</g><g transform="translate(2400,0)">${far}</g></g></svg>`;
  /* roadside pool picks and overhead spacing are seeded so the level is the same every run */
  const rng = mulberry32(seed * 7919 + (typeof world === "number" ? world : 99) * 131 + 5);
  let side = 1, x = 150;
  let nextArch = 1500 + Math.floor(rng() * 800);
  const archEnd = len - 2300;   /* the finish gantry sits at len - 1600; leave it room */
  for (; x < len; x += SCENERY_STEP) {
    addScenery(x, side, rng); side = -side;
    if (x >= nextArch && x < archEnd) {
      let ax = x + 225;
      while (inArchZone(ax)) ax += 300;
      if (ax < archEnd) addArch(ax);
      nextArch = ax + (key === "parade" ? 1200 : 1700 + Math.floor(rng() * 1000));   /* the parade keeps them coming */
    }
  }
  freeSceneryX = x; freeArchX = x;
  addChevrons();
  /* night sky pinpricks, built once */
  const sky = document.getElementById("skyStars");
  if (!sky.childElementCount) {
    let dots = "";
    const srng = mulberry32(99);
    for (let i = 0; i < 40; i++) dots += `<circle cx="${srng() * 1200}" cy="${srng() * 280}" r="${1.2 + srng() * 2}" fill="#f1faee" opacity="${0.5 + srng() * 0.5}"/>`;
    sky.innerHTML = `<svg width="1200" height="700" viewBox="0 0 1200 700">${dots}</svg>`;
  }
}

/* ============ 23. ROAD: RENDER ============ */
/* ---- projection: one sprite onto the stage ---- */
const FLAT_PROPS = new Set(["puddle", "oil", "ice", "finish", "fan", "trophy", "scenery"]);
function placeSprite(p, carX) {
  const z = p.x - carX;
  if (z > DRAW_FAR || z < DRAW_NEAR || occHidAt(z)) {   /* out of range, or on ground a crest ahead hides whole */
    if (p.vis) { p.wrap.style.display = "none"; p.vis = false; }
    return;
  }
