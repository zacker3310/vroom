  const f0 = Math.ceil(progress.fuel), t0 = Math.ceil(progress.tread);
  progress.fuel = Math.max(0, progress.fuel - d / FUEL_PER_UNIT);
  progress.tread = Math.max(0, progress.tread - d / TREAD_PER_UNIT);
  if (Math.ceil(progress.fuel) !== f0 || Math.ceil(progress.tread) !== t0) renderHudUpkeep(true);
  /* low tank: the engine coughs and the gauge jolts; dry: faster coughs */
  if (progress.fuel <= FUEL_LOW && v > 40 && now - sputterT > (progress.fuel <= 0 ? 340 : 620)) {
    sputterT = now;
    tone("square", 120, 60, 0.09, 0.14); noiseBurst(0.05, 700, 0.12);
    restartAnim(hudFuel, "pop"); restartAnim(hudUpkeep, "pop");
  }
}
function renderHudUpkeep(pop) {
  const fLow = progress.fuel <= FUEL_LOW, tLow = progress.tread <= TREAD_LOW;
  const fuelHTML = fuelIcon + `<span>${Math.ceil(progress.fuel)}</span>`, tireHTML = tireIcon + `<span>${Math.ceil(progress.tread)}</span>`;
  hudFuel.innerHTML = fuelHTML; hudFuel.classList.toggle("low", fLow); hudFuel.classList.toggle("solo", fLow);
  hudTires.innerHTML = tireHTML; hudTires.classList.toggle("low", tLow); hudTires.classList.toggle("solo", tLow);
  /* the combined chip carries whatever is not low: both in the fuel slot, or the healthy one in the free slot */
  hudUpkeep.innerHTML = (fLow ? "" : fuelHTML) + (tLow ? "" : tireHTML);
  hudUpkeep.classList.toggle("off", fLow && tLow);
  hudUpkeep.classList.toggle("half", fLow !== tLow);
  hudUpkeep.classList.toggle("down", fLow && !tLow);
  if (pop) { restartAnim(hudFuel, "pop"); restartAnim(hudTires, "pop"); restartAnim(hudUpkeep, "pop"); }
}
/* the shield is good, not perfect (v12.6): each pip raises the chance that a point of damage bounces off.
   armorRoll is a seam the suites replace to force a block or a miss. */
const ARMOR_BLOCK = [0, 0.5, 0.65, 0.8];
let armorRoll = () => Math.random();
function applyDamage(n) {
  const block = ARMOR_BLOCK[progress.upgrades.armor] || 0;
  let soaked = 0;
  for (let i = 0; i < n; i++) if (armorRoll() >= block) soaked++;
  if (soaked < n) { sfx.clank(); shieldFlash(); }   /* the shield took some of it: ping + blue flash */
  if (!soaked) return;
  progress.damage = Math.min(MAX_DAMAGE, progress.damage + soaked);
  progress.tread = Math.max(0, progress.tread - HIT_TREAD * soaked);   /* a hard hit scuffs the tires too */
  runDamage += soaked;
  save();
  sfx.crunch();
  buddyReact("duck");
  updateDamageVisuals();
  renderHudDamage(true);
  restartAnim(hudDamage, "bump");   /* the wrench chip takes the knock: a 150 ms pop over the slower .pop */
  renderHudUpkeep(true);
}
function shieldFlash() {
  const svg = carWrap.querySelector("svg");
  if (svg) restartAnim(svg, "shieldHit");
}
function updateDamageVisuals() {
  for (const [cls, min] of [["dmgScuff", 1], ["dmgCrack", 3], ["dmgSmoke", 5]]) {
    carWrap.querySelectorAll("." + cls).forEach(el => el.style.display = progress.damage >= min ? "" : "none");
  }
}
function renderHudDamage(pop) {
  hudDamage.innerHTML = wrenchIcon + `<span>${progress.damage}</span>`;
  hudDamage.classList.toggle("hurt", progress.damage >= 5);
  if (pop) { restartAnim(hudDamage, "pop"); }
}

function tick(now) {
  /* hit-stop: freeze the world for a beat after a crash */
  if (now < freezeUntil) {
    lastT = now;
    rafId = requestAnimationFrame(tick);
    return;
  }
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  const gas = gasPointers.size > 0 || roadPointers.size > 0 || gasKey;
  const brake = brakePointers.size > 0 || brakeKey;
  if (!finished) {
    if (brake) {
      if (v > 120) sfxSquealThrottle();
      v = Math.max(0, v - BRAKE * dt);
    } else if (gas) v = Math.min(vmaxEff(), v + ACCEL * dt);
    else v = Math.max(0, v - COAST * dt);
    pos += v * dt;
    burnUpkeep(v * dt, now);
  } else v = 0;
  engineSet(v, gas, brake);
  worldTick(dt);   /* ambience level, bend scrub, live sky events */

  /* idle nudge: a parked car pulses the gas pedal for first-timers */
  if (v === 0 && !finished && !gas) {
    idleT += dt;
    if (idleT > 4) gasPedal.classList.add("nudge");
  } else {
    idleT = 0;
    gasPedal.classList.remove("nudge");
  }

  if (paradeMode && !finished) {
    fireworkT += dt;
    if (fireworkT > 0.75) {
      fireworkT = 0;
      spawnFirework();
      if (Math.random() < 0.4) confettiBurst(roadScene, 6);
    }
  }
  if (freeMode) {
    tickFree();
    /* the day's star meter: what was spent earlier today plus this run; the cap ends the run */
    const used = Math.min(FREE_CAP, freeUsedToday() + runStars);
    progDot.style.left = (100 * used / FREE_CAP) + "%";
    const left = String(FREE_CAP - used);
    if (left !== lastShownTime) { lastShownTime = left; hudTime.textContent = left; }
    if (!finished && used >= FREE_CAP) finishFree();
  } else {
    if (!finished) {
      runTime += dt;
      const shown = runTime.toFixed(2);
      if (shown !== lastShownTime) { lastShownTime = shown; hudTime.textContent = shown; }
    }
    /* almost there! */
    if (!nearFinish && pos > LEVEL_LEN - 900) { nearFinish = true; sfx.almost(); }
    progDot.style.left = Math.min(100, pos / LEVEL_LEN * 100) + "%";
    if (!paradeMode) ghostTick(dt);   /* GHOST RACE: sample the run, roll the twin, refresh the gap chip */
  }

  const carX = pos + CAR_SCREEN_X;

  /* lane glide */
  laneVis += (targetLane - laneVis) * Math.min(1, dt * 9 * gripK());
  if (Math.abs(targetLane - laneVis) < 0.01) laneVis = targetLane;
  carWrap.style.zIndex = 19990;   /* depth 10: props a hair past the bumper draw behind it */

  tickMovers(dt);

  /* ramp + jump */
  if (airborne) {
    vy -= gravityNow() * springK() * dt;   /* space world: floaty low-gravity jumps; springs scale both ways so airtime and landing stay put */
    jumpY += vy * dt;
    if (jumpY <= 0) {
      const fall = -vy;   /* touchdown speed, px/s */
      jumpY = 0; airborne = false; sfx.clank();
      /* landing: suspension squash + a kick of dust; the body squats by the fall (recovers through bodyTilt's ease, ~120 ms)
         and the camera dips with it */
      const svg = carWrap.querySelector("svg");
      if (svg) { svg.classList.remove("land"); void carWrap.offsetWidth; svg.classList.add("land"); gagTimer(() => svg.classList.remove("land"), 450); }
      bodyTilt += Math.min(8, fall * 0.012);
      landCam(fall);
      spawnDust();
    }
  } else {
    const wasOn = jumpY > 0;
    const onRamp = rampElev(carX);
    jumpY = onRamp;
    if (wasOn && onRamp === 0) {
      const L = rampLaunch(rampBehind(carX), v);   /* each ramp kind kicks by its own numbers */
      airborne = true; vy = L.vy * springK(); jumpY = L.y;
      sfx.whee();                                   /* every launch gets its whee */
      award("jump");
    }
  }

  /* props */
  for (const p of props) {
    if (p.done) continue;
    PROP_HIT[p.type](p, carX - p.x);
  }

  /* wheels */
  wheelAngle = (wheelAngle + v * dt * 0.045) % 7;   /* tread bands are 7 apart */
  wheelEls.forEach(w => w.style.transform = `translateY(${wheelAngle.toFixed(1)}px)`);
  /* the mixer drum churns with the road speed: a lazy turn when parked, a blur flat out */
  if (drumEls.length && rollOK) {
    drumAngle = (drumAngle + dt * (40 + v * 0.95)) % 360;
    drumEls.forEach(d => d.style.transform = `rotate(${drumAngle.toFixed(1)}deg)`);
  }
  /* into a corkscrew: a rising swirl; through a hard turn at speed: the tires howl */
  const twNow = inTwist(carX);
  if (twNow && !inTwistNow) sfx.corkscrew();
  inTwistNow = twNow;
  if (!airborne && v > 450 && Math.abs(curvAt(carX)) >= HARD_K) sfxSquealThrottle();

  /* body dynamics: lean back on the gas, dive on the brake, bank through lane changes */
  const accel = dt > 0 ? (v - prevV) / dt : 0;
  prevV = v;
  const targetBody = Math.max(-8, Math.min(8, accel * 0.006)) + (targetLane - laneVis) * 4;
  bodyTilt += (targetBody - bodyTilt) * Math.min(1, dt * 10);

  /* speed lines when flying along at (near) top speed */
  speedLines.style.opacity = v > 0.9 * vmaxEff() ? 1 : 0;

  tickLane();
  camTick(dt);   /* camera springs: lateral lag, throttle punch, landing dip, shake */
  /* world + car. From behind: bank into lane changes, squat on the gas, lift on the brake */
  renderWorld();
  /* the car stays square to the road: no skew, no bank (v12.6); it squats on the gas, lifts on the brake */
  const squat = Math.max(-6, Math.min(6, bodyTilt * 0.7));
  tickYaw(dt);
  setCarView(laneViewQ(), yawStep());   /* inner flank in a side lane; nose toward the lane it is heading for */
  const cdx = carScreenX() - 600;
  /* the loop: the car follows the ribbon. Its spot on the ribbon, less the part the level camera followed, moves it
     up the wall and over the top; it turns with the ribbon about its own contact point (upside down at the top) */
  const th = twistLive ? rollCar : 0;
  let tx = cdx, ty = squat - jumpY, crot = "";
  if (th) {
    tx += (1 - LOOP_FOLLOW) * carRibDX; ty -= (1 - LOOP_FOLLOW) * carRibY;
    crot = ` rotate(${(-th).toFixed(4)}rad)`;
  }
  carWrap.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)${crot}`;

  rafId = requestAnimationFrame(tick);
}
let lastSqueal = 0;
function sfxSquealThrottle() {
  const t = performance.now();
  if (t - lastSqueal > 320) { lastSqueal = t; sfx.squeal(); }
}

function bindPedal(el, set) {
  el.addEventListener("pointerdown", e => {
    e.stopPropagation();

    set.add(e.pointerId);

}

roadScene.addEventListener("pointerdown", e => {
  if (e.target.closest(".bigBtn") || e.target.closest(".pedal") || e.target.closest("#celebrate") || e.target.closest(".chip")) return;
  try { roadScene.setPointerCapture(e.pointerId); } catch (err) {}
  roadPointers.set(e.pointerId, e.clientX);
});
roadScene.addEventListener("pointermove", e => {
  if (!roadPointers.has(e.pointerId)) return;
  const scale = stage.getBoundingClientRect().width / 1200;
  const dx = (e.clientX - roadPointers.get(e.pointerId)) / scale;
  /* 70px of sideways drag per lane change, so long swipes track the finger */
  if (dx < -70) { setLane(targetLane - 1); roadPointers.set(e.pointerId, e.clientX); }
  else if (dx > 70) { setLane(targetLane + 1); roadPointers.set(e.pointerId, e.clientX); }
});
function pointerEnd(e) {
  roadPointers.delete(e.pointerId);
  if (gasPointers.delete(e.pointerId) && gasPointers.size === 0) gasPedal.classList.remove("held");
  if (brakePointers.delete(e.pointerId) && brakePointers.size === 0) brakePedal.classList.remove("held");

/* ---- ambience beds: looping noise/osc nodes through one master gain (quiet-mode re-read live) ---- */
const AMB_LEVEL = 0.04;
function ambTargetLevel() { return AMB_LEVEL * volScale() * (music ? AMB_UNDER_MUSIC : 1); }   /* a notch lower under the music bed */
let amb = null;              /* { master, nodes, timers, world } */
let ambNoiseBuf = null;
function noiseBuffer() {
  if (ambNoiseBuf) return ambNoiseBuf;
  const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return ambNoiseBuf = buf;
}
/* a looping noise voice: type/freq/Q filter -> gain (relative to the bed master) */
function ambNoise(type, freq, q, gain) {
  const src = actx.createBufferSource(); src.buffer = noiseBuffer(); src.loop = true;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(amb.master);
  src.start();
  amb.nodes.push(src);
  return { src, f, g };
}
/* a slow LFO wobbling an AudioParam by +-depth around its own value */
function ambLFO(param, hz, depth) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = hz; g.gain.value = depth;
  o.connect(g).connect(param); o.start();
  amb.nodes.push(o);
}
function ambOsc(type, freq, gain) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.value = gain;
  o.connect(g).connect(amb.master); o.start();
  amb.nodes.push(o);
  return { o, g };
}
/* one-shot voices for the periodic flourishes, routed through the bed master (not volScale'd twice) */
function ambPing(type, f0, f1, dur, gain, delay = 0) {
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.03, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(amb.master); o.start(t); o.stop(t + dur + 0.02);
}
function ambHiss(freq, dur, gain, delay = 0) {
  const t = actx.currentTime + delay;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer();
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.08, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(amb.master); src.start(t); src.stop(t + dur + 0.02);
}
/* repeat fn every min..max ms with jitter, until the bed stops */
function ambEvery(min, max, fn) {
  const go = () => { if (!amb) return; fn(); amb.timers.push(setTimeout(go, min + Math.random() * (max - min))); };
  amb.timers.push(setTimeout(go, min * 0.5 + Math.random() * min));
}

/* ---- hook-ins called from startDrive / stopDrive / tick ---- */
function worldAudioStart() {
  if (paradeMode) scheduleEvents(PARADE_LEVEL, 1);   /* the parade has its own fixed sky schedule */
  if (!actx) return;
  passByLast = 0;
  try { playJingle(); ambStart(); scrubStart(); musicStart(); } catch (e) { /* audio hiccups never stop a level */ }
}
function worldAudioStop() {
  document.querySelectorAll(".liveEv").forEach(e => e.remove());   /* their removal timers die with gagTimers */
  try { ambStop(); scrubStop(); musicStop(); } catch (e) {}
}
function worldTick(dt) {
  if (actx) { ambTick(dt); scrubSet(); musicTick(dt); passByTick(); }
  eventsTick();
}

/* ============ 27. FINISH + CELEBRATION ============ */
function confettiBurst(sceneEl, count) {
  const cols = ["#e63946", "#ffd60a", "#43a047", "#1e88e5", "#ec407a", "#fb8c00"];
  if (reducedMotion()) return;   /* no pieces to spawn when the device asks for less motion */
  for (let i = 0; i < count; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 1200 + "px";
    c.style.background = cols[i % cols.length];
    c.style.setProperty("--spin", (Math.random() * 900 - 450) + "deg");
    c.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    c.style.animationDelay = (Math.random() * 0.8) + "s";
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
    sceneEl.appendChild(c);
  }
  setTimeout(() => sceneEl.querySelectorAll(".confetti").forEach(c => c.remove()), 4200);
}

/* a star pops out of the tally and sails into the wallet chip */
function flyStar(fromEl, toEl, spark) {
  const rd = roadScene.getBoundingClientRect();
  const s = rd.width / 1200;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = spark ? "flyStar spark" : "flyStar"; d.innerHTML = starIcon;
  const half = spark ? 11 : 22, jx = spark ? Math.random() * 40 - 20 : 0, jy = spark ? Math.random() * 30 - 15 : 0;   /* sparks scatter a little */
  d.style.left = ((a.left + a.width / 2 - rd.left) / s - half + jx) + "px";
  d.style.top = ((a.top + a.height / 2 - rd.top) / s - half + jy) + "px";
  roadScene.appendChild(d);
  requestAnimationFrame(() => {
    d.style.transform = `translate(${(b.left - a.left + (b.width - a.width) / 2) / s}px, ${(b.top - a.top + (b.height - a.height) / 2) / s}px) scale(.45)`;
    d.style.opacity = ".2";
  });
  setTimeout(() => d.remove(), 700);
}

function finishLevel() {
  sfx.tada();
  buddyReact("wave");
  confettiBurst(roadScene, 90);
  roadScene.classList.add("celebrating");   /* run HUD steps aside: one star number at a time */

  const clean = runDamage === 0;
  const isParade = paradeMode;
  const prev = isParade ? null : progress.levels[level];
  /* ---- GHOST RACE (T17.3): a run that beat the stored ghost replaces it; losing to it changes nothing.
     Decided up front because it sets the payout ---- */
  let ghostBeaten = false, ghostHad = null;
  if (!isParade && ghostRec) {
    ghostHad = prev && ghostValid(prev.ghost) ? prev.ghost : null;
    ghostBeaten = !!ghostHad && runTime < ghostHad.t;
  }
  /* ---- the payout rule (13.6): a first clear or a new star best pays every star; beating your ghost pays them
     x1.5 (GHOST_MULT); a plain replay pays half and skips the finish and clean bonuses, so a favourite level is
     still a treat but not a farm. Stars only ever go up: nothing here takes anything away. ---- */
  const newBest = !isParade && (!prev || runStars > prev.best);
  const repeat = !isParade && !newBest && !ghostBeaten;
  const payMult = ghostBeaten ? GHOST_MULT : repeat ? REPEAT_MULT : 1;
  const paid = isParade ? runStars : Math.round(runStars * payMult);
  /* first time beating a world's last level = big trophy bonus;
     finishing the parade = the champion jackpot (a warm 10 on replays) */
  const worldBonus = isParade
    ? (progress.badges.includes("champ") ? 10 : 100)
    : (level % WORLD_SIZE === 0 && !prev) ? 25 : 0;
  /* shine bonus: a truck that crosses the line spotless and ding-free earns +50% on the stars it collected.
     Puddles and hits during the run cost it, so upkeep in the garage pays out on the road. */
  const shiny = !isParade && !progress.muddy && progress.damage === 0;
  const shine = shiny ? Math.ceil(paid * SHINE_MULT) : 0;
  const bonus = (repeat ? 0 : 3 + (clean ? 2 : 0)) + worldBonus + shine;   /* clean-run bonus: no new dings this run */
  const banked = paid + bonus;
  const frac = totalStars ? runStars / totalStars : 1;
  const rating = isParade ? 3 : frac >= 0.65 ? 3 : frac >= 0.34 ? 2 : 1;
  if (worldBonus) { confettiBurst(roadScene, isParade ? 260 : 160); setTimeout(() => sfx.tada(), 600); }
  if (isParade) setTimeout(() => sfx.tada(), 1200);

  const walletStart = progress.wallet;
  progress.wallet += banked;
  const tier = isParade ? "S" : timeTier(level, runTime);

  /* album keepsakes: a finish-line photo of this exact build, plus first-time stickers */
  progress.photos.unshift({ b: JSON.parse(JSON.stringify(state)), n: level, t: tier, s: runStars });
  progress.photos = progress.photos.slice(0, 6);
  if (isParade) award("champ");
  else {
    if (clean) award("clean");
    if (shine) award("shine");
    if (tier === "S") award("s");
    if (worldBonus) award("world");
  }
  if (!isParade) {
    progress.levels[level] = {
      best: Math.max(prev ? prev.best : 0, runStars),
      rating: Math.max(prev ? prev.rating : 0, rating),
      bestTime: Math.min(prev && prev.bestTime ? prev.bestTime : Infinity, Math.round(runTime * 100) / 100),
      tier: (prev && prev.tier && TIER_RANK[prev.tier] > TIER_RANK[tier]) ? prev.tier : tier
    };
    if (level < MAX_LEVEL) progress.current = Math.max(progress.current, level + 1);
  }
  /* ---- GHOST RACE: store this run as the ghost when there was none or it was beaten ---- */
  if (!isParade && ghostRec) {
    progress.levels[level].ghost = (!ghostHad || ghostBeaten) ? { t: Math.round(runTime * 100) / 100, p: ghostRec } : ghostHad;
    ghostRec = null;
  }
  /* ---- end GHOST RACE ---- */
  save();
  if (!isParade) eventFinish(level);   /* SURPRISE EVENTS: rainbow day hands over its paint */

  /* build the tally UI */
  const tally = document.getElementById("tallyChip");
  tally.innerHTML = starIcon + `<span>0</span>` + (repeat ? `<b class="half">½</b>` : "");   /* a replay's half rate, on the tally itself */
  tally.classList.toggle("repeat", repeat);
  const cWallet = document.getElementById("celebrateWallet");
  cWallet.innerHTML = starIcon + `<span>${walletStart}</span>`;
  const cTime = document.getElementById("celebrateTime");
  cTime.innerHTML = isParade
    ? `<span class="medal">${BADGES.find(b => b.id === "champ").icon}</span>`
    : stopwatchIcon + `<span>${runTime.toFixed(2)}</span>` + `<span class="medal">${medalSVG(tier)}</span>`
      + (ghostBeaten ? `<span class="ghostWin">${ghostIcon}${ghostCheckIcon}<b>×1.5</b></span>` : "");   /* GHOST RACE: beat your ghost = ghost + check + the multiplier */
  cTime.classList.toggle("newBest", ghostBeaten);   /* GHOST RACE: the medal pops bigger on a new best */
  const cDamage = document.getElementById("celebrateDamage");
  cDamage.innerHTML = wrenchIcon + `<span>${progress.damage}</span>`;
  cDamage.classList.toggle("clean", clean);
  /* the wrench is garage business — only show it on the victory screen if this run got dinged */
  cDamage.style.display = runDamage > 0 ? "" : "none";
  const cShine = document.getElementById("celebrateShine");
  cShine.innerHTML = sparkIcon + `<span>+${shine}</span>`;
  cShine.style.display = shine > 0 ? "" : "none";
  const ratingRow = document.getElementById("ratingRow");
  ratingRow.innerHTML = [1, 2, 3].map(() =>
    `<svg class="rateStar" viewBox="0 0 64 64"><path d="M32 2 L40 22 L62 24 L45 39 L51 61 L32 48 L13 61 L19 39 L2 24 L24 22 Z" fill="#ffd60a" stroke="#fb8500" stroke-width="3"/></svg>`).join("");
  document.getElementById("nextBtn").style.display = (level < MAX_LEVEL && !isParade) ? "" : "none";
  renderGhostTease(isParade ? null : progress.levels[level] && progress.levels[level].ghost);

  celebrateTimer = setTimeout(() => {
    document.getElementById("celebrate").classList.add("active");
    /* count the stars up one by one, then light the rating */
    let shown = 0;
    const span = tally.querySelector("span");
    const walletSpan = cWallet.querySelector("span");
    tallyTimer = setInterval(() => {
      shown++;
      span.textContent = shown;
      walletSpan.textContent = walletStart + shown;
      flyStar(tally, cWallet);
      restartAnim(cWallet, "pop");
      sfx.tick(shown);
      restartAnim(tally, "pop");
      if (shown >= banked) {
        clearInterval(tallyTimer); tallyTimer = null;
        const rs = ratingRow.querySelectorAll(".rateStar");
        for (let i = 0; i < rating; i++) {
          rateTimers.push(setTimeout(() => { rs[i].classList.add("lit"); sfx.chime(); }, 250 + i * 350));
        }
        /* Nintendo pacing: the payoff plays out first, THEN the buttons slide in */
        rateTimers.push(setTimeout(() => {

/* Three small events rotate with the calendar day. The picks come from a tiny seeded RNG keyed on
   the local YYYY-MM-DD (window.__today overrides it for the suites), so the whole day shows the
   same surprise and tomorrow brings a fresh one. Every draw happens unconditionally so a kid's
   progress during the day never reshuffles the rest; no date at all means no events, quietly.
     1. sleeping dino: a snoozing dino on one beaten level of the current world (never the
        frontier). On that road it naps across the middle lane near the start. A honk (tap the
        car), crawling up to it, or simply bumping into it wakes it: a yawn, a stomp off to the
        roadside and 5 bonus stars on the lane. Not hard, no damage, never a stop, never counted
        in the level's star total (the fairness bots see only a gift).
     2. rainbow day (once level 30 is beaten): a rainbow over the map and a rainbow pip on one
        unlocked level; finishing it today awards the secret "p:rainbowshine" paint, once.
     3. weather day: one unlocked world's tab wears a rain or snow badge; every level of that
        world runs with that weather's particles (the world's own spec is swapped for it).
   Plus the "today" chip: a sun with the day of the month, so the kid ties surprises to days.

/* today's three picks (plus the day number) for the current progress; 0 / null = no event */
function dailyEvents() {
  const key = todayKey();
  const out = { key, day: 0, dino: 0, rainbow: 0, weather: null, weatherWorld: 0 };
  if (!key) return out;
  out.day = parseInt(key.slice(8), 10) || 0;
  const rng = mulberry32(daySeed(key));
  /* the frontier is the first level not yet beaten; its world is "the current world" */
  let frontier = 1;
  while (frontier < MAX_LEVEL && progress.levels[frontier]) frontier++;
  const w = worldOf(frontier);
  const worldLevels = k => Array.from({ length: WORLD_SIZE }, (_, i) => (k - 1) * WORLD_SIZE + 1 + i);
  const dinoOrder = seededShuffle(worldLevels(w), rng), dinoPrev = seededShuffle(worldLevels(Math.max(1, w - 1)), rng);
  const napSpot = n => levelUnlocked(n) && n !== frontier;
  out.dino = dinoOrder.find(napSpot) || (w > 1 ? dinoPrev.find(napSpot) : 0) || 0;
  const rbOrder = seededShuffle(worldLevels(w), rng);
  const rb = rbOrder.find(n => levelUnlocked(n) && n !== out.dino) || rbOrder.find(n => levelUnlocked(n)) || 0;
  if (progress.levels[30]) out.rainbow = rb;
  const kinds = Object.keys(EVENT_WEATHER);
  out.weather = kinds[Math.floor(rng() * kinds.length)];
  const wOrder = seededShuffle(Array.from({ length: WORLD_COUNT }, (_, i) => i + 1), rng);
  out.weatherWorld = wOrder.find(k => k <= w && k !== EVENT_WEATHER[out.weather].world) || 0;

  const dn = node(ev.dino);
  if (dn) dn.insertAdjacentHTML("beforeend", `<span class="evDino" aria-label="sleeping dino">${EV_DINO_MAP}</span>`);
  const rn = node(ev.rainbow);

/* ============ 30. SCENE: TITLE + DAILY GIFT ============ */
/* The boot ceremony: the kid's own car idles under a wordless emblem, the buddy bobs, one huge
   green GO leads to the garage. The engine putter can only start after the first touch (audio
   unlock), so the first tap anywhere on the title starts it. The page skips the title when it is
   opened with `?garage` in the URL or `localStorage["vroom.skipTitle"]` is set (the test suites
   use `?garage`), and once after a profile switch (sessionStorage "vroom.toGarage"). */
const titleScene = document.getElementById("title");
const titleCar = document.getElementById("titleCar");
const titleGo = document.getElementById("titleGo");
const titleGift = document.getElementById("titleGift");
const titleProfileBtn = document.getElementById("titleProfileBtn");
const giftBtn = document.getElementById("giftBtn");

/* ---- the daily gift: once per local calendar day, stored on this device only ---- */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function giftReady() { return progress.lastGift !== todayStr(); }
const GIFT_STARS_MIN = 15, GIFT_STARS_MAX = 40, GIFT_BUDDY_ODDS = 1 / 6;
function renderGift() {
  const ready = giftReady();
  giftBtn.classList.toggle("show", ready);
  if (ready && !giftBtn.classList.contains("opening")) giftBtn.innerHTML = capsuleSVG;
  titleGift.classList.toggle("show", ready);
  if (ready) titleGift.innerHTML = capsuleSVG;
}
/* a star (or a buddy face) sails from one element to another inside a scene, same move as flyStar on the road */
function flyIcon(sceneEl, fromEl, toEl, html) {
  const sr = sceneEl.getBoundingClientRect(), s = sr.width / 1200 || 1;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "flyStar"; d.innerHTML = html;
  d.style.left = ((a.left + a.width / 2 - sr.left) / s - 22) + "px";
  d.style.top = ((a.top + a.height / 2 - sr.top) / s - 22) + "px";
  sceneEl.appendChild(d);
  requestAnimationFrame(() => {
    d.style.transform = `translate(${(b.left - a.left + (b.width - a.width) / 2) / s}px, ${(b.top - a.top + (b.height - a.height) / 2) / s}px) scale(.45)`;
    d.style.opacity = ".2";
  });
  setTimeout(() => d.remove(), 700);
}
function openGift() {
  if (!giftReady() || giftBtn.classList.contains("opening")) return;
  progress.lastGift = todayStr();
  giftBtn.classList.add("opening");
  giftBtn.innerHTML = capsulePopSVG;
  sfx.capsuleOpen(); confettiBurst(garageScene, 70);
  setTimeout(() => sfx.tada(), 320);
  const unfound = BUDDY_ORDER.filter(id => !progress.owned.buddy.includes(id));
  if (unfound.length && Math.random() < GIFT_BUDDY_ODDS) {
    /* a new friend: its face flies to the car and hops straight on */
    const nb = unfound[Math.floor(Math.random() * unfound.length)];
    progress.owned.buddy.push(nb);
    state.buddy = nb;
    save();
    flyIcon(garageScene, giftBtn, preview, `<svg viewBox="-4 -56 72 68">${BUDDY_SVG[nb]}</svg>`);
    setTimeout(() => { renderPreview(); sfx.squeak(); }, 620);
  } else {
    /* stars, weighted toward the low end: 15 is common, 40 is a lucky day */
    const amount = GIFT_STARS_MIN + Math.floor(Math.random() * Math.random() * (GIFT_STARS_MAX - GIFT_STARS_MIN + 1));
    progress.wallet += amount;
    save();
    for (let i = 0; i < 6; i++) setTimeout(() => { flyIcon(garageScene, giftBtn, garageWallet, starIcon); sfx.tick(i + 2); }, 120 + i * 110);
    setTimeout(() => renderWallets(true), 900);
  }
  setTimeout(() => { giftBtn.classList.remove("opening"); renderGift(); }, 1500);
}
giftBtn.addEventListener("pointerdown", e => { e.stopPropagation(); openGift(); });

/* ---- the idle putter: the road engine held at a low chug, with a slow wobble on its gain ---- */
let titleIdle = null;
function titleIdleStart() {
  if (!actx || engine || titleIdle || !titleScene.classList.contains("active")) return;
  engineStart();
  if (!engine) return;
  const t = actx.currentTime;
  engine.o.frequency.setTargetAtTime(40, t, 0.2); engine.o2.frequency.setTargetAtTime(40, t, 0.2);
  engine.f.frequency.setTargetAtTime(300, t, 0.2);
  engine.g.gain.setTargetAtTime(0.03 * volScale(), t, 0.4);
  const lfo = actx.createOscillator(), lg = actx.createGain();
  lfo.type = "sine"; lfo.frequency.value = 6.5; lg.gain.value = 0.018 * volScale();
  lfo.connect(lg).connect(engine.g.gain); lfo.start();
  titleIdle = { lfo, lg };
}
function titleIdleStop() {
  if (titleIdle) { try { titleIdle.lfo.stop(); } catch (e) {} titleIdle = null; }
  engineStop();
}

function renderTitle() {

/* the shadow and the exhaust hang off the tire line, which differs per body (tracks and hover rings have
   no tires: their art's lowest point stands in); measured once the scene is on screen, in stage px */
function placeTitleGround() {
  const svg = titleCar.querySelector("svg");
  if (!svg || !titleScene.classList.contains("active")) return;
  const k = stage.getBoundingClientRect().width / 1200 || 1;
  const box = titleCar.getBoundingClientRect(), wheels = [...titleCar.querySelectorAll(".wheelrot")];
  let line = box.bottom;
  if (wheels.length) line = Math.max(...wheels.map(w => w.getBoundingClientRect().bottom));
  else { try { const bb = svg.getBBox(), r = svg.getBoundingClientRect(); line = r.top + (bb.y + bb.height) * r.height / 230; } catch (e) {} }
  titleCar.style.setProperty("--tGround", Math.round((box.bottom - line) / k) + "px");
}
function showTitle() { renderTitle(); showScene(titleScene); requestAnimationFrame(placeTitleGround); }
function skipTitle() {
  if (/[?&]garage\b/.test(location.search)) return true;
  try {
    if (localStorage.getItem("vroom.skipTitle")) return true;
    if (sessionStorage.getItem("vroom.toGarage")) { sessionStorage.removeItem("vroom.toGarage"); return true; }
  } catch (e) {}
  return false;
}
titleScene.addEventListener("pointerdown", () => titleIdleStart());   /* after unlockAudio (capture) */
titleCar.addEventListener("pointerdown", e => {
  e.stopPropagation(); titleIdleStart();
  sfx.honk(state.body);
  restartAnim(titleCar, "bounce"); restartAnim(titleCar, "blink");
  if (state.buddy) setTimeout(() => sfx.squeak(), 160);
});
titleGo.addEventListener("pointerdown", e => {
  e.stopPropagation();
  sfx.pop(); titleIdleStop(); showGarage();
});
titleProfileBtn.addEventListener("pointerdown", e => {
  e.stopPropagation(); sfx.pop();
  renderProfiles(); renderQR();
  profileOverlay.classList.add("show");
});
renderGift();
if (!skipTitle()) showTitle();
welcomeImport();   /* a save was just loaded: the car says hello (section 17) */

/* ============ 31. BOOT: NEW VERSION GATE ============ */
/* No service worker here: a stale game is Safari's cache or a home-screen app left running.
   Fingerprint the code this page booted with, and quietly compare it against a fresh copy
   from the server on boot, whenever the app comes back to the foreground, and every 10 min. */
const updateBtn = document.getElementById("updateBtn");
const bootCode = (() => {
  const st = document.querySelector("style"), sc = document.querySelector("script");
  return (st ? st.textContent : "") + (sc ? sc.textContent : "");
})();
function codeHash(str) {   /* FNV-1a: plenty for "did it change" */
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
const bootHash = codeHash(bootCode);
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (location.protocol === "file:" || Date.now() - lastUpdateCheck < 30000) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const st = doc.querySelector("style"), sc = doc.querySelector("script");
    if (!st || !sc) return;
    if (codeHash(st.textContent + sc.textContent) !== bootHash) updateGates.forEach(b => b.classList.add("show"));
  } catch (e) { /* offline in the car: keep playing what we have */ }
}
/* the gate sits on both the title and the garage (same button, same hold); whichever is held fills its own ring */
const UPDATE_HOLD_MS = 1600;
const updateGates = [document.getElementById("titleUpdateBtn"), updateBtn];
let updateHoldT = null, updateHoldStart = 0, updateHoldRaf = null, updateHeld = null;
function updateHoldEnd() {
  clearTimeout(updateHoldT); cancelAnimationFrame(updateHoldRaf);
  updateHoldT = null;
  if (updateHeld) { updateHeld.classList.remove("holding"); updateHeld.querySelector(".ring").style.strokeDashoffset = 251.3; }
  updateHeld = null;
}
for (const gate of updateGates) {
  const ring = gate.querySelector(".ring");
  gate.addEventListener("pointerdown", e => {
    e.stopPropagation();
    if (updateHoldT) updateHoldEnd();
    try { gate.setPointerCapture(e.pointerId); } catch (err) {}
    sfx.pop();
    updateHeld = gate;
    gate.classList.add("holding");
    updateHoldStart = performance.now();
    (function fill() {
      const f = Math.min(1, (performance.now() - updateHoldStart) / UPDATE_HOLD_MS);
      ring.style.strokeDashoffset = 251.3 * (1 - f);
      if (f < 1) updateHoldRaf = requestAnimationFrame(fill);
    })();
    updateHoldT = setTimeout(() => {
      save();
      sfx.tada();
      /* cache-busting navigation so Safari can't hand back the old page */
      setTimeout(() => location.replace(location.pathname + "?v=" + Date.now() + location.hash), 350);
    }, UPDATE_HOLD_MS);
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) gate.addEventListener(ev, () => { if (updateHoldT && updateHeld === gate) updateHoldEnd(); });
}
setTimeout(checkForUpdate, 2500);
setInterval(checkForUpdate, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
</script>
