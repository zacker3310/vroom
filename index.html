/* ============ LEVEL MAP ============ */
const mapGrid = document.getElementById("mapGrid");
function levelUnlocked(n) { return n === 1 || !!progress.levels[n - 1]; }
function worldUnlocked(w) { return w === 1 || !!progress.levels[(w - 1) * WORLD_SIZE]; }
let selectedWorld = 1;
function worldTint(w) {
  return (typeof WORLD_TINT !== "undefined" && (WORLD_TINT["w" + w] || WORLD_TINT[w])) || "#219ebc";
}
/* level nodes sit ON a winding road: alternating heights along the path */
const MAP_NODE_Y = [0, -44, -70, -40, 8, 36, 4, -42, -66, -30];
function renderMap() {
  /* world tabs: one themed button per world, locked until the previous world is finished */
  const tabs = document.getElementById("worldTabs");
  tabs.innerHTML = "";
  for (let w = 1; w <= WORLD_COUNT; w++) {
    const b = document.createElement("button");
    const open = worldUnlocked(w);
    b.className = "bigBtn worldTab pressable enter" + (w === selectedWorld ? " sel" : "") + (open ? "" : " locked");
    b.style.setProperty("--i", w - 1);
    if (open) b.style.background = worldTint(w);
    b.innerHTML = open
      ? ((typeof WORLD_ICONS !== "undefined" && WORLD_ICONS["w" + w]) || `<span>${w}</span>`)
      : lockIcon;
    b.setAttribute("aria-label", "world " + w);
    b.addEventListener("pointerdown", () => {
      if (open) { sfx.pop(); selectedWorld = w; renderMap(); }
      else { sfx.deny(); b.classList.remove("deny"); void b.offsetWidth; b.classList.add("deny"); }
    });
    tabs.appendChild(b);
  }

  document.getElementById("paradeBtn").classList.toggle("show", paradeUnlocked());

  /* tint the meadow toward the selected world */
  document.getElementById("mapGround").style.background = worldTint(selectedWorld);

  /* the winding journey road with 10 nodes on it */
  mapGrid.innerHTML = "";
  const first = (selectedWorld - 1) * WORLD_SIZE + 1;
  const pathPts = [];
  for (let i = 0; i < WORLD_SIZE; i++) pathPts.push([90 + i * 113, 180 + MAP_NODE_Y[i]]);
  let d = `M ${pathPts[0][0]} ${pathPts[0][1]}`;
  for (let i = 1; i < pathPts.length; i++) {
    const [px, py] = pathPts[i - 1], [x, y] = pathPts[i];
    d += ` Q ${(px + x) / 2} ${i % 2 ? py : y} ${x} ${y}`;
  }
  mapGrid.insertAdjacentHTML("beforeend",
    `<svg id="mapPath" width="1140" height="360" viewBox="0 0 1140 360">
       <path d="${d}" stroke="#00000022" stroke-width="34" fill="none" stroke-linecap="round"/>
       <path d="${d}" stroke="#fdf6ea" stroke-width="26" fill="none" stroke-linecap="round" stroke-dasharray="4 26"/>
     </svg>`);

  let firstLockedShown = false;
  for (let n = first; n < first + WORLD_SIZE; n++) {
    const i = n - first;
    const b = document.createElement("button");
    b.className = "bigBtn lvlBtn pressable enter";
    b.style.setProperty("--i", i + 2);
    b.style.left = (pathPts[i][0] - 48) + "px";
    b.style.top = (pathPts[i][1] - 48) + "px";
    const done = progress.levels[n];
    if (!levelUnlocked(n)) {
      b.classList.add("locked");
      /* only the NEXT locked node wears the padlock; the rest are quiet dots on the road ahead */
      if (!firstLockedShown) { b.innerHTML = lockIcon; firstLockedShown = true; }
      else { b.classList.add("far"); b.innerHTML = ""; }
      b.addEventListener("pointerdown", () => {
        sfx.deny();
        b.classList.remove("deny"); void b.offsetWidth; b.classList.add("deny");
      });
    } else {
      b.classList.add(done ? "done" : "open");
      if (n === progress.current) b.classList.add("current");
      let stars = "", tierBadge = "";
      if (done) {
        stars = `<span class="miniStars">` + [1, 2, 3].map(j =>
          `<svg viewBox="0 0 64 64"><path d="M32 2 L40 22 L62 24 L45 39 L51 61 L32 48 L13 61 L19 39 L2 24 L24 22 Z" fill="${j <= done.rating ? "#ffd60a" : "#00000033"}"/></svg>`).join("") + `</span>`;
        if (done.tier) tierBadge = `<span class="tierBadge">${medalSVG(done.tier)}</span>`;
      }
      b.innerHTML = `<span>${n}</span>` + stars + tierBadge;
      b.addEventListener("pointerdown", () => { sfx.pop(); progress.current = n; save(); drive(n); });
    }
    b.setAttribute("aria-label", "level " + n);
    mapGrid.appendChild(b);
  }
}

   World coords: x = distance along the road (unchanged from the side-scroller, so all the

const hudTime = document.getElementById("hudTime");

const HORIZON = 290;              /* vanishing line on the stage */
const CAM_D = 520;                /* camera sits this far behind the car; scale 1 at the car */
const CAM_H = 360;                /* camera height: the car's ground line lands at y=650 */
const LANE_W = 240;               /* lane spacing at the car's depth */

const CAR_HIT_Z = 100;            /* collisions land this far up the car (mid-hood), not at the bumper */
const LOW_STAR_H = 85, HIGH_STAR_H = 240;
let camX = 0, camSkyX = 0;
const laneX = l => (l - 1) * LANE_W;

/* ---- the course: curvature along the road (OutRun style) ----
   COURSE is a list of stretches {x0, x1, k}: signed curvature (px of lateral drift per
   unit² of depth), eased in and out over CURVE_EASE so bends start and end smoothly.
   The car always drives the road's centerline, so at depth z the road sits
   off(z) = ∬ k to the side; everything projected (asphalt, sprites, scenery) adds that. */
let COURSE = [];
const CURVE_EASE = 320;
const CURVE = { gentle: 0.0001, medium: 0.00018, tight: 0.0003 };
function curvAt(x) {
  let k = 0;
  for (const c of COURSE) {
    if (x < c.x0 - CURVE_EASE || x > c.x1 + CURVE_EASE) continue;
    let w = 1;
    if (x < c.x0) w = (x - (c.x0 - CURVE_EASE)) / CURVE_EASE;
    else if (x > c.x1) w = ((c.x1 + CURVE_EASE) - x) / CURVE_EASE;
    k += c.k * w;
  }
  return k;
}
/* heading angle (radians-ish) accumulated along the road: drives the skyline parallax */
function headingAt(x) {
  let h = 0;
  for (const c of COURSE) {
    const a = Math.max(c.x0 - CURVE_EASE, 0), b = Math.min(c.x1 + CURVE_EASE, x);
    if (b <= a) continue;
    h += c.k * (b - a) * 900;   /* flat approximation of the eased ends: good enough for a sky */
  }
  return h;
}
/* per-frame lateral offset table, sampled every OFF_STEP of depth from the car */
const OFF_STEP = 40, OFF_N = Math.ceil((DRAW_FAR - DRAW_NEAR) / OFF_STEP) + 2;
const OFF = new Float32Array(OFF_N);
let offBaseZ = DRAW_NEAR;
function buildOffsets(carX) {
  /* integrate outward from the car (z=0, where the road is dead ahead) */
  const i0 = Math.round(-DRAW_NEAR / OFF_STEP);
  offBaseZ = -i0 * OFF_STEP;
  let dx = 0, off = 0;
  OFF[i0] = 0;
  for (let i = i0 + 1; i < OFF_N; i++) {
    const z = offBaseZ + i * OFF_STEP;
    dx += curvAt(carX + z) * OFF_STEP;
    off += dx * OFF_STEP;
    OFF[i] = off;
  }
  dx = 0; off = 0;
  for (let i = i0 - 1; i >= 0; i--) {
    const z = offBaseZ + i * OFF_STEP;
    dx -= curvAt(carX + z) * OFF_STEP;
    off -= dx * OFF_STEP;
    OFF[i] = off;
  }
}
function offAt(z) {
  const f = (Math.min(Math.max(z, offBaseZ), offBaseZ + (OFF_N - 1) * OFF_STEP) - offBaseZ) / OFF_STEP;
  const i = Math.floor(f), t = f - i;
  return i >= OFF_N - 1 ? OFF[OFF_N - 1] : OFF[i] * (1 - t) + OFF[i + 1] * t;

/* ---- hills: smooth cosine bumps/dips along the road. The camera rides the road at the
   car, so a crest ahead lifts the far road toward the sky and a dip hides it. ---- */
let HILLS = [], curCarX = 0, camElev = 0;
function elevAt(x) {
  let e = 0;
  for (const hl of HILLS) {
    if (x <= hl.x0 || x >= hl.x1) continue;
    e += hl.amp * (1 - Math.cos((x - hl.x0) / (hl.x1 - hl.x0) * Math.PI * 2)) / 2;
  }
  return e;
}
function addHill(x0, len, amp) { HILLS.push({ x0, x1: x0 + len, amp }); return x0 + len; }
/* course authoring: every world has a road character (how hard it bends, whether it has
   hairpins, how long its straights run) and every level in a world gets a different shape
   from a fixed, hand-ordered menu: a single giant sweeper, a chicane festival, a drag strip
   with a hairpin at the end... so level 3 and level 4 are recognizably different roads and
   the finale of each world is a tour of everything. All bends stay out of the first 600
   and last 700 units (CURVE_EASE is already inside those margins). */
function addBend(x0, len, k) { COURSE.push({ x0, x1: x0 + len, k }); return x0 + len; }
const WORLD_ROAD = {
  /*  k: base curvature, hp: hairpin strength (0 = none in this world), len/gap: bend length and
      straight multipliers, order: the ten level shapes */
  1: { k: CURVE.gentle * 0.8,  hp: 0,   len: 1.0, gap: 1.0, order: ["sweeper", "bookends", "esses", "twin", "sweeper", "wiggle", "spiral", "esses", "drag", "tour"] },      /* construction: wide and forgiving */
  2: { k: CURVE.gentle * 1.3,  hp: 0,   len: 1.3, gap: 1.2, order: ["esses", "sweeper", "twin", "spiral", "bookends", "esses", "drag", "sweeper", "wiggle", "tour"] },      /* farm: long lazy sweepers over hills */
  3: { k: CURVE.medium,        hp: 0.8, len: 0.8, gap: 0.8, order: ["chicanes", "esses", "hairpins", "wiggle", "twin", "chicanes", "spiral", "drag", "esses", "tour"] },    /* night: twisty mountain road */
  4: { k: CURVE.gentle * 1.15, hp: 0,   len: 1.7, gap: 1.6, order: ["drag", "bookends", "sweeper", "twin", "esses", "drag", "sweeper", "bookends", "twin", "tour"] },       /* rain: highway, long straights, wide curves */
  5: { k: CURVE.medium * 1.1,  hp: 1.0, len: 0.9, gap: 0.9, order: ["hairpins", "wiggle", "chicanes", "spiral", "hairpins", "esses", "drag", "chicanes", "hairpins", "tour"] }, /* snow: the mountain pass, switchbacks */
  6: { k: CURVE.medium * 0.9,  hp: 0.9, len: 1.4, gap: 1.5, order: ["drag", "sweeper", "bookends", "chicanes", "drag", "twin", "hairpins", "sweeper", "drag", "tour"] },    /* desert: drag strips and one giant sweeper */
  7: { k: CURVE.medium,        hp: 0.7, len: 1.1, gap: 1.0, order: ["esses", "twin", "sweeper", "wiggle", "esses", "spiral", "hairpins", "esses", "twin", "tour"] },        /* beach: rhythmic coast road */
  8: { k: CURVE.tight * 0.9,   hp: 1.1, len: 0.8, gap: 0.7, order: ["chicanes", "wiggle", "hairpins", "spiral", "chicanes", "drag", "wiggle", "hairpins", "chicanes", "tour"] } /* moon: wild */
};
function buildCourse(n, rng, len) {
  COURSE = [];
  const w = worldOf(n), i = (n - 1) % WORLD_SIZE, P = WORLD_ROAD[w] || WORLD_ROAD[8];
  const k = P.k * (0.85 + 0.3 * i / 9);                      /* later levels in a world bend a little harder */
  const hk = P.hp ? CURVE.tight * 1.15 * P.hp : k * 1.7;     /* no hairpins in this world: a firm sweep instead */
  const x0 = 950, x1 = len - 1020;
  let dir = rng() < 0.5 ? 1 : -1;
  /* a bend clipped to the course window; returns where it ends (or x unchanged if no room) */
  const bend = (x, L, kk) => { L = Math.min(L, x1 - x); return L < 200 ? x : addBend(Math.max(x, x0), L, kk); };
  const Lm = m => Math.round(m * P.len * (0.9 + rng() * 0.2)), Gm = m => Math.round(m * P.gap * (0.8 + rng() * 0.4));
  const sweep = (x, L, d) => bend(x, L, d * k);
  const hairpin = (x, d) => bend(x, Lm(560), d * hk);
  const chicane = (x, d) => { let e = bend(x, Lm(260), d * k * 1.4); e = bend(e + 60, Lm(260), -d * k * 1.4); return bend(e + 60, Lm(260), d * k * 1.4); };
  const span = x1 - x0;
  const T = {
    sweeper() { sweep(x0 + span * 0.12, span * 0.76, dir); },                                  /* one giant bend */
    esses() { for (let x = x0; x < x1 - 400; dir = -dir) x = sweep(x, Lm(900), dir) + Gm(240); },  /* alternating sweepers */
    twin() { const L = span * 0.36; sweep(x0, L, dir); sweep(x1 - L, L, -dir); },             /* two long bends, straight between */
    bookends() { sweep(x0, Lm(650), dir); sweep(x1 - Lm(650), Lm(650), -dir); },             /* bends at both ends, long straight middle */
    drag() { hairpin(x1 - Lm(560) - Gm(200), dir); },                                        /* drag strip, hairpin at the end */
    wiggle() { for (let x = x0 + Gm(300), j = 0; x < x1 - 300 && j < 9; dir = -dir, j++) x = bend(x, Lm(380), dir * k * 1.2) + Gm(120); }, /* a run of short flicks */
    spiral() { let x = x0 + Gm(200); for (let j = 0; j < 3 && x < x1 - 400; j++) x = bend(x, Lm(700), dir * k * (0.7 + 0.3 * j)) + Gm(260); }, /* same way, tightening */
    chicanes() { for (let x = x0 + Gm(150), j = 0; x < x1 - 500 && j < 5; dir = -dir, j++) x = chicane(x, dir) + Gm(420); },   /* chicane festival */
    hairpins() { const x = hairpin(x0 + span * 0.15, dir); hairpin(Math.max(x + Gm(900), x1 - span * 0.15 - Lm(560)), -dir); }, /* two hairpins, straight between */
    tour() {   /* the finale: a sweeper, a chicane, a hairpin and esses, back to back */
      let x = sweep(x0, Lm(900), dir) + Gm(200);
      x = chicane(x, -dir) + Gm(200);
      x = hairpin(x, dir) + Gm(260);
      for (; x < x1 - 400; dir = -dir) x = sweep(x, Lm(700), -dir) + Gm(180);
    }
  };
  T[P.order[i]]();
  COURSE = COURSE.filter(c => c.x1 > c.x0 + 80);
  /* hills by world: flat construction/rain/beach, rolling farmland and dunes, big snowy
     rises, lumpy moon; later levels in a world roll harder */
  HILLS = [];
  const hillAmp = worldMeta(w).hill * (0.7 + 0.3 * ((n - 1) % 10) / 9);
  if (hillAmp) {
    let hx = 600 + rng() * 600;
    while (hx < len - 1400) {
      const L = 1100 + rng() * 1300;
      const amp = hillAmp * (0.5 + rng() * 0.5) * (rng() < 0.3 ? -0.6 : 1);   /* mostly rises, some dips */
      hx = addHill(hx, L, amp) + rng() * 500;
    }
  }
  return COURSE;
}
function carScreenX() { return 600 + (laneVis - 1) * LANE_W * (1 - CAM_FOLLOW); }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============ CHASE-CAM VEHICLE: the build as chunky 3D toy blocks, seen from behind ============ */
/* Each body is boxes / cylinders / hulls in car space (x lateral, y up, z forward from the rear
   bumper), projected through the same camera as the road, so you see the roof, the cab past
   the bed, the hood running off toward the horizon and the front wheels poking out ahead.
   SVG origin = the rear bumper's ground point (stage 600,650); units = stage px at the car.
   Painter's order: far z0 first, then low y0 first. A part resting on another shares its z0
   (split the one underneath otherwise); `late` parts (rails, stacks, horns) draw last. */
/* CAR_K shrinks the whole build in car space (so perspective stays honest): the art is
   authored at full size, the car on the road is half that */
const CAR_K = 0.5;
const VS = z => CAM_D / (z * CAR_K + CAM_D) * CAR_K;   /* px per car-space unit at depth z */
const vp = (x, y, z) => { const s = CAM_D / (z * CAR_K + CAM_D); return [x * CAR_K * s, (CAM_H - y * CAR_K) * s - CAM_H]; };
const fx = n => n.toFixed(1);
const ptStr = a => a.map(p => fx(p[0]) + "," + fx(p[1])).join(" ");
const vpoly = (pts, fill, extra = "") => `<polygon points="${ptStr(pts)}" fill="${fill}" stroke-linejoin="round" ${extra}/>`;
function hull2(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
/* a ring around the z axis (cylinder end) and one in the ground plane (saucer/dome slice) */
const ringZ = (cx, cy, r, z) => [...Array(20)].map((_, i) => [cx + r * Math.cos(i * Math.PI / 10), cy + r * Math.sin(i * Math.PI / 10), z]);
const ringY = (y, R, zc) => [...Array(24)].map((_, i) => [R * Math.cos(i * Math.PI / 12), y, zc + R * Math.sin(i * Math.PI / 12)]);

const VP = "var(--paint)", VG = "#bde0fe", VD = "#495057", VM = "#6c757d", VK = "#343a40", VR = "#e63946";
/* part constructors */
const box = (x0, x1, y0, y1, z0, z1, fill, o = {}) => ({ k: "box", x0, x1, y0, y1, z0, z1, y1f: o.y1f ?? y1, fill, ...o });
const cbox = (w, y0, y1, z0, z1, fill, o) => box(-w, w, y0, y1, z0, z1, fill, o);
const cyl = (yb, rb, z0, yf, rf, z1, fill, o = {}) => ({ k: "cyl", x: 0, yb, rb, z0, yf, rf, z1, y0: yb - rb, fill, ...o });
const hullP = (rings, fill, o = {}) => ({ k: "hull", rings, fill, z0: o.z0 ?? 0, y0: o.y0 ?? 0, ...o });
const spr = (x, y, z, svg, sc = 1, o = {}) => ({ k: "spr", x, y, z, svg, sc, z0: z, y0: y, ...o });
const poly3 = (pts, fill, o = {}) => ({ k: "poly3", pts, fill, z0: o.z0 ?? Math.min(...pts.map(q => q[2])), y0: o.y0 ?? Math.min(...pts.map(q => q[1])), ...o });
/* rocket fin: a thin swept blade radiating from the fuselage at angle a (deg, 0 = right, 90 = up) */
function rocketFin(a) {
  const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180), cy = 112;
  const P = (r, z, t) => [c * r - s * t, cy + s * r + c * t, z];
  return hullP([[P(64, 16, -6), P(64, 16, 6), P(64, 170, -4), P(64, 170, 4), P(150, 24, -5), P(150, 24, 5), P(150, 70, -4), P(150, 70, 4)]],
    VP, { z0: 15, y0: 0, shade: .12, edge: true });
}
/* dragon wing: raised bat membrane with bones and a scalloped trailing edge (side = -1 | 1) */
function dragonWing(side) {
  const X = q => [q[0] * side, q[1], q[2]];

  return poly3([root1, tip, s1, m1, s2, m2, root2].map(X), VP, { z0: 39, lite: .16,
    bones: [[root1, tip], [[100, 146, 150], s1], [[100, 146, 120], s2]].map(b => b.map(X)) });

/* helpers for paint on a box's back face (y measured before lift; the face knows its lift) */
const tail = (x, y, w = 22, h = 14) => F => F(x, y, x + w, y + h, VR, 'class="tailLight"');

const CAR3D = {
  dump: { len: 450, half: 104, axles: [80, 370],
    roof: [0, 196, 350], mount: [-104, 126, 8], deco: [0, 88, 0], win: [0, 160, 300], smoke: [73, 240, 296],
    parts: () => [
      cbox(108, 40, 126, 0, 250, VP, { topDark: true, deco: (F) =>
        F(-92, 104, 92, 110, "#00000022") + F(-92, 66, 92, 72, "#00000022") + tail(-100, 50)(F) + tail(78, 50)(F) + F(-108, 34, 108, 48, VD) }),

  if (st.color === "rainbow") {
    defs = `<defs><linearGradient id="rg${uid}" gradientUnits="userSpaceOnUse" x1="-130" y1="0" x2="130" y2="0">
      <stop offset="0" stop-color="#e53935"/><stop offset=".2" stop-color="#fb8c00"/>
      <stop offset=".4" stop-color="#fdd835"/><stop offset=".6" stop-color="#43a047"/>
      <stop offset=".8" stop-color="#1e88e5"/><stop offset="1" stop-color="#8e24aa"/>
    </linearGradient></defs>`;
    paint = `url(#rg${uid})`;
  }
  /* tires: rear + front axle, outboard of the body */
  const tw = st.wheels === "racing" ? 48 : st.wheels === "tank" ? 60 : Math.round(28 + r * 0.45);
  const [wsR, wsF] = R.wheelScale || [1, 1];
  const tires = [];
  [[R.axles[0], wsR, true], [R.axles[1], wsF, false]].forEach(([zc, ws, rear]) => {
    for (const side of [-1, 1]) tires.push({ k: "tire", type: st.wheels, uid, rear, cx: side * (R.half + tw / 2 - 6), tw: tw * Math.min(1.3, ws), r: r * ws, zc, z0: zc - r * ws * 0.8, y0: 0 });
  });
  const parts = R.parts().concat(tires);
  const normal = parts.filter(p => !p.late).sort((a, b) => (b.z0 - a.z0) || (a.y0 - b.y0));
  const late = parts.filter(p => p.late).sort((a, b) => (b.z0 - a.z0) || (a.y0 - b.y0));
  const body = normal.concat(late).map(p => p.k === "tire" ? partSVG(p, 0) : partSVG(p, L)).join("");

  /* overlay anchors: project a car-space point, return [x, y, scale] */
  const A = (q, dx = 0, dy = 0) => { const [x, y] = vp(q[0] + dx, q[1] + L + dy, q[2]); return [x, y, VS(q[2])]; };

  if (ex.beacon) over += at(R.roof, `<g transform="translate(52,-26)"><rect x="-14" y="18" width="28" height="8" rx="4" fill="#adb5bd"/>
      <path d="M-10 18 Q-10 -2 0 -2 Q10 -2 10 18Z" fill="#ff9f1c" stroke="#e76f51" stroke-width="2"/>

  if (typeof NEW_EXTRAS_SVG !== "undefined") {
    const wq = [-R.half, 110, 60], wq2 = [R.half, 110, 60];
    if (ex.wings) over += at(wq, NEW_EXTRAS_SVG.wings(0, 0), 1.6) + at(wq2, NEW_EXTRAS_SVG.wings(0, 0), 1.6, true);
    if (ex.booster) over += at([0, R.deco[1], R.deco[2]], `<circle r="17" fill="#ced4da" stroke="#023047" stroke-width="3"/><circle r="11" fill="#495057"/>

    if (ex.partyhat) over += at(hasBuddy ? R.roof : [R.roof[0] + 34, R.roof[1], R.roof[2]], NEW_EXTRAS_SVG.partyhat(0, hasBuddy ? -40 : 0), 1.2);

    [[-R.half + 22, 52, 9], [-30, 44, 7], [34, 48, 8], [R.half - 20, 56, 6]].map(([x, y, rr]) => { const [px, py, s] = A([x, y, rz]); return `<circle cx="${fx(px)}" cy="${fx(py)}" r="${fx(rr * s)}" fill="#6b4423"/>`; }).join("")}</g>`;
  over += `<g class="dmgScuff" style="display:${progress.damage >= 1 ? "" : "none"}">${at(dq, `<g stroke="#37474f" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none"><path d="M-52 -6 l22 -6 M-46 4 l16 -4 M34 -8 l18 6"/></g>`)}${
    at([R.mount[0] + 18, R.mount[1] - 14, R.mount[2]], `<g transform="rotate(-18)"><rect x="-16" y="-6" width="32" height="12" rx="6" fill="#e9d8c3"/><rect x="-6" y="-16" width="12" height="32" rx="6" fill="#e9d8c3"/><circle r="3" fill="#c9b697"/></g>`)}</g>`;
  over += `<g class="dmgCrack" style="display:${progress.damage >= 3 ? "" : "none"}">${at(R.win, `<path d="M6 -12 l-9 9 l11 7 l-7 9 M-3 -3 l-9 3 M8 4 l10 5" stroke="#f8f9fa" stroke-width="3" fill="none" opacity=".9"/>`, 1.2)}</g>`;
  const [sx, sy, ss] = A(R.smoke);
  over += `<g class="dmgSmoke" style="display:${progress.damage >= 5 ? "" : "none"}" fill="#90a4ae">
      <circle cx="${fx(sx)}" cy="${fx(sy)}" r="${fx(13 * ss)}" opacity=".85"/>
      <circle cx="${fx(sx + 8 * ss)}" cy="${fx(sy - 6 * ss)}" r="${fx(10 * ss)}" opacity=".7" style="animation-delay:.45s"/>
      <circle cx="${fx(sx - 7 * ss)}" cy="${fx(sy - 9 * ss)}" r="${fx(8 * ss)}" opacity=".6" style="animation-delay:.9s"/></g>`;
  return `<svg viewBox="-200 -460 400 500" style="--paint:${paint}">
    ${defs}
    ${body}
    ${over}
    <rect class="hitbox" x="${fx((-R.half - 40) * CAR_K)}" y="-150" width="${fx((2 * R.half + 80) * CAR_K)}" height="160" fill="transparent"/>
  </svg>`;
}

/* level runtime */
let level = 1, lastPlayed = 1, freeMode = false, paradeMode = false;
const PARADE_LEVEL = MAX_LEVEL + 1;
function paradeUnlocked() {
  for (let n = 1; n <= MAX_LEVEL; n++) if (!progress.levels[n]) return false;
  return true;
}
let LEVEL_LEN = 5200, RAMPS = [], props = [], scenery = [], totalStars = 0, runStars = 0, runDamage = 0, runTime = 0;
let freeSpawnX = 0, freeThemeIdx = 0, freeSceneryX = 0, freeCourseX = 0, sceneryWorld = 1;

function rampElev(x) {
  for (const rp of RAMPS) {
    const d = x - rp.x;
    if (d >= 0 && d <= rp.w) return (d / rp.w) * rp.h;
  }
  return 0;

/* a sprite: an outer .sprite wrapper the projector moves/scales (anchor = its 0,0),
   holding the .prop element whose own transforms/animations stay free for gags */
function makeSprite(type, x, lx, h, svg, xOff, yOff, k) {
  const wrap = document.createElement("div");
  wrap.className = "sprite";
  const el = document.createElement("div");
  el.className = "prop " + type;
  el.innerHTML = svg;
  el.style.cssText = `left:${xOff}px; top:${yOff}px;`;
  wrap.appendChild(el);
  worldEl.appendChild(wrap);
  return { type, x, lx, h, el, wrap, k: k || 1, done: false, vis: false, zi: 0 };
}
function addProp(type, x, lane, h, svg, xOff, yOff) {
  const p = makeSprite(type, x, laneX(lane), h, svg, xOff, yOff);
  p.lane = lane;
  p.y = 585 - h;   /* legacy screen-ish height (low stars > 400) for older tooling */
  props.push(p);
  return p;
}
function clearWorld() {
  for (const p of props) p.wrap.remove();
  for (const p of scenery) p.wrap.remove();
  props = []; scenery = []; RAMPS = []; totalStars = 0;
}

/* ============ BEAT SEQUENCER: a level is a seeded sequence of formations ============
   Every level has a signature beat (repeated with variations) plus 1-2 contrasting
   beats and breathers, so level 7 feels like "the snake-trail level" and level 8 like
   "the barrel-bowling level". Beats read curvAt(x) so star trails hug the inside of a
   bend and obstacles crowd the outside. Required ingredients (puddles, capsules, oil,
   tnt, world hazards) and the hard/star budgets are guaranteed by passes at the end. */
const BEATS = {};
function defBeat(name, kind, minLvl, fn) { BEATS[name] = { name, kind, minLvl, fn }; }
/* hard obstacle / star / level budgets (tests pin the ordering L5 <= L15 <= L30) */
const minHard = n => n < 3 ? 0 : Math.floor(1 + Math.min(n, 50) * 0.3);   /* past level 50 the formations, not random fills, bring the hazards */
const maxHard = n => n < 3 ? 0 : Math.floor(2 + n * 0.45);
const minStars = n => 12 + Math.floor(Math.min(n, 45) / 2);
const maxStars = n => 22 + Math.floor(n * 1.2);
const HARD_T = t => t === "barrel" || t === "rock" || t === "tnt" || !!(EXTRA_PROPS[t] && EXTRA_PROPS[t].hard);
const SOFT_T = t => t === "cone" || !!(EXTRA_PROPS[t] && !EXTRA_PROPS[t].hard && t !== "ice");
const BLOCKER_T = t => HARD_T(t) || SOFT_T(t) || t === "oil" || t === "ice" || t === "puddle" || t === "capsule";

/* ---- star trails ---- */
defBeat("trailStraight", "star", 1, (b, x) => {
  const lane = b.pickLane(x), k = b.S + Math.floor(b.rng() * 3);
  for (let i = 0; i < k; i++) b.star(x + i * 115, lane);
  return x + k * 115;
});
defBeat("snake", "star", 1, (b, x) => {
  const k = b.S + 2 + Math.floor(b.rng() * 3), dir = b.rng() < 0.5 ? 1 : -1;
  let lane = dir > 0 ? 0 : 2, d = dir;
  for (let i = 0; i < k; i++) {
    b.star(x + i * 135, lane);
    if (lane + d < 0 || lane + d > 2) d = -d;
    lane += d;
  }
  return x + k * 135;
});
defBeat("rainbow", "star", 1, (b, x) => {
  const seq = b.rng() < 0.5 ? [0, 1, 2, 1, 0, 1, 2, 1, 0] : [2, 1, 0, 1, 2, 1, 0, 1, 2];
  const k = Math.min(seq.length, b.S + 3);
  for (let i = 0; i < k; i++) b.star(x + i * 120, seq[i]);
  return x + k * 120;
});
defBeat("arc", "star", 3, (b, x) => {   /* hugs the inside of the bend, drifts with it */
  const k = b.S + 3;
  for (let i = 0; i < k; i++) { const sx = x + i * 125; b.star(sx, b.inside(sx)); }
  /* a cone on the outside halfway: the bend pushes you in */
  if (b.n >= 2) b.put(b.soft(), x + Math.floor(k / 2) * 125, b.outside(x + Math.floor(k / 2) * 125));
  return x + k * 125;
});
defBeat("doubleRow", "star", 1, (b, x) => {
  const skip = Math.floor(b.rng() * 3), lanes = [0, 1, 2].filter(l => l !== skip), k = 3 + Math.floor(b.S / 2);
  for (let i = 0; i < k; i++) for (const l of lanes) b.star(x + i * 130, l);
  if (b.n >= 2) b.put(b.soft(), x + Math.floor(k / 2) * 130, skip);
  return x + k * 130;
});
defBeat("starGate", "star", 3, (b, x) => {   /* two lanes of stars, one lane blocked */
  const cols = 2 + Math.floor(b.rng() * 2);
  for (let c = 0; c < cols; c++) {
    const gx = x + c * 320, blk = b.rng() < 0.6 ? b.outside(gx) : Math.floor(b.rng() * 3);
    for (let l = 0; l < 3; l++) l === blk ? b.put(b.hardOrSoft(), gx, l) : b.star(gx, l);
    b.star(gx + 130, b.rng() < 0.5 ? (blk + 1) % 3 : (blk + 2) % 3);
  }
  return x + cols * 320;
});
defBeat("starShower", "star", 6, (b, x) => {   /* a confetti burst of stars, every lane */
  const cols = 3 + Math.floor(b.rng() * 2);
  for (let c = 0; c < cols; c++) for (let l = 0; l < 3; l++) b.star(x + c * 120 + (l === 1 ? 60 : 0), l);
  return x + cols * 120 + 60;
});
defBeat("stairway", "star", 1, (b, x) => {   /* zig low stars climbing lane by lane toward a bend */
  const k = b.S + 2, up = b.inside(x + k * 60) === 2;
  for (let i = 0; i < k; i++) b.star(x + i * 120, up ? Math.min(2, Math.floor(i / 2)) : Math.max(0, 2 - Math.floor(i / 2)));
  return x + k * 120;
});

/* ---- obstacle shapes ---- */
defBeat("slalom", "obs", 2, (b, x) => {
  const k = 3 + Math.floor(b.d * 4), lanes = b.rng() < 0.5 ? [0, 2] : [2, 0];
  for (let i = 0; i < k; i++) {
    const ox = x + i * 270, l = lanes[i % 2];
    b.put(b.hardOrSoft(), ox, l);
    b.star(ox + 135, 2 - l);         /* the hint: the star sits where you should be */
    if (i % 2 === 0) b.star(ox + 135, 1);   /* the middle lane is safe all the way through */
  }
  return x + k * 270;
});
defBeat("gate", "obs", 5, (b, x) => {   /* two lanes shut, one open with a star */
  const gates = 1 + Math.floor(b.d * 2.5);
  let open = -1;
  for (let g = 0; g < gates; g++) {
    const gx = x + g * 560;   /* a breath between gates: one decision per 0.8s at full speed */
    let want = b.rng() < 0.5 ? b.inside(gx) : Math.floor(b.rng() * 3);
    want = open < 0 ? b.nearLane(want) : Math.abs(want - open) > 1 ? open + Math.sign(want - open) : want;   /* never two lanes over at once */
    open = want;
    for (let l = 0; l < 3; l++) if (l !== open) b.put(g === 0 || b.rng() < 0.6 ? b.hard() : b.soft(), gx, l);
    b.star(gx - 200, open); b.star(gx, open); b.star(gx + 120, open);   /* the lead-in star shows the way through */
  }
  return x + gates * 560;
});
defBeat("closingWalls", "obs", 8, (b, x) => {   /* the open lane walks across the road */
  let open = b.nearLane(Math.floor(b.rng() * 3));
  const dir = open === 0 ? 1 : open === 2 ? -1 : (b.rng() < 0.5 ? 1 : -1), k = 3;
  for (let g = 0; g < k; g++) {
    const gx = x + g * 430;   /* one lane step per 430 units: small hands can follow it */
    for (let l = 0; l < 3; l++) if (l !== open) b.put(l === (open + dir + 3) % 3 || b.rng() < 0.5 ? b.hard() : b.soft(), gx, l);
    b.star(gx, open);
    open = Math.max(0, Math.min(2, open + dir));
  }
  return x + k * 430;
});
defBeat("coneForest", "obs", 1, (b, x) => {   /* soft and silly: cones everywhere, stars between */
  const cols = 4 + Math.floor(b.rng() * 3);
  for (let c = 0; c < cols; c++) {
    const cx = x + c * 170, free = Math.floor(b.rng() * 3), other = [0, 1, 2].filter(l => l !== free);
    const i = Math.floor(b.rng() * 2);
    b.put(b.soft(), cx, other[i]);
    if (b.rng() < 0.5) b.put(b.soft(), cx, other[1 - i]);
    if (c % 2 === 1) b.star(cx, free);
  }
  return x + cols * 170;
});
defBeat("bowling", "obs", 3, (b, x) => {   /* barrels in a V, the star sits at the tip */
  const flip = b.rng() < 0.5;
  const L = l => flip ? 2 - l : l;
  b.put(b.hardOrSoft(), x, L(0));
  b.star(x, L(2)); b.star(x + 130, L(1));
  b.put(b.hardOrSoft(), x + 270, L(0)); b.put(b.hardOrSoft(), x + 270, L(2));
  b.star(x + 400, L(1)); b.star(x + 530, L(1));
  b.put(b.hardOrSoft(), x + 540, L(2)); b.put(b.hardOrSoft(), x + 540, L(0));
  b.star(x + 670, L(1));
  return x + 700;
});
defBeat("minefield", "obs", 12, (b, x) => {   /* sparse tnt, stars mark the safe lane */
  const cols = 3 + Math.floor(b.d * 2);
  let safe = b.nearLane(b.rng() < 0.4 ? 1 : Math.floor(b.rng() * 3));
  for (let c = 0; c < cols; c++) {
    const cx = x + c * 330;
    b.put("tnt", cx, (safe + 1 + Math.floor(b.rng() * 2)) % 3);
    b.star(cx, safe); b.star(cx + 165, safe);
    if (b.rng() < 0.5) safe = Math.max(0, Math.min(2, safe + (b.rng() < 0.5 ? 1 : -1)));   /* one lane step per column */
  }
  return x + cols * 330;
});
defBeat("capsuleAlley", "rhythm", 3, (b, x) => {   /* a capsule flanked by cones, stars lead in */
  const lane = b.pickLane(x);
  b.star(x, lane); b.star(x + 120, lane);
  b.capsule(x + 300, lane);
  for (let l = 0; l < 3; l++) if (l !== lane) b.put(b.soft(), x + 300, l);
  b.star(x + 450, lane);
  return x + 500;
});
defBeat("puddleParty", "rhythm", 2, (b, x) => {   /* splash through every lane, then stars */
  const order = b.rng() < 0.5 ? [0, 1, 2] : [2, 1, 0];
  for (let i = 0; i < 3; i++) b.put("puddle", x + i * 160, order[i]);

defBeat("oilSlalom", "rhythm", 5, (b, x) => {   /* slick lanes alternate, stars on the dry side */
  const k = 2 + Math.floor(b.d * 2), a = Math.floor(b.rng() * 3);

/* ---- ramp beats: every ramp pushes {x, w:250, h:95, tail} into RAMPS and leaves a high star
   on the jump arc at rx+460. A full-throttle launch off the lip (rx+250) lands ~680 units

defBeat("ramp", "ramp", 1, (b, x) => { const r = rampAt(b, x); moonArc(b, r); return r.rx + flightLen(b.w); });
defBeat("rampArc", "ramp", 4, (b, x) => {   /* three high stars along the flight path */
  const r = rampAt(b, x);
  b.high(r.rx + 370, r.lane, flightH(b.w, 370)); b.high(r.rx + 550, r.lane, b.w === 8 ? flightH(8, 550) : HIGH_STAR_H);

/* ---- world beats (worlds 5-8 bring their own cast) ---- */
defBeat("snowmanChoir", "world5", 41, (b, x) => {   /* a row of snowmen singing across the lanes */
  const k = 4 + Math.floor(b.rng() * 2), start = Math.floor(b.rng() * 3);

defBeat("icePatch", "world5", 41, (b, x) => {   /* slick lanes, one dry line of stars */

  for (let i = 0; i < 4; i++) b.star(x + i * 120, dry);

defBeat("cactusCanyon", "world6", 51, (b, x) => {   /* cacti line both edges, stars run the middle */

});
defBeat("tumbleweeds", "world6", 51, (b, x) => {   /* a few roll down at you, stars on the clear side */

defBeat("crabCrossing", "world7", 61, (b, x) => {   /* crabs scuttle lanes between sandcastles */

defBeat("sandcastles", "world7", 61, (b, x) => {   /* a beach of castles with a star path through */

defBeat("craterField", "world8", 71, (b, x) => {   /* craters zigzag, the stars show the ridge */
  const k = 3 + Math.floor(b.d * 2);
  let s = b.last;   /* the safe ridge starts under the kid and steps one lane at a time */
  for (let i = 0; i < k; i++) {

defBeat("alienWelcome", "world8", 71, (b, x) => {   /* a welcome line of aliens, stars alongside */
  const l = b.pickLane(x), k = 4;
  for (let i = 0; i < k; i++) { b.put("alien", x + i * 150, l); b.star(x + i * 150, (l + 1) % 3); }

/* which beats a level may draw its signature / contrast from */

    nearLane(want) { return Math.max(this.last - 1, Math.min(this.last + 1, want)); },   /* one lane step away at most */
    inside(x) { const k = curvAt(x); return k > 0.00003 ? 2 : k < -0.00003 ? 0 : 1; },
    outside(x) { const k = curvAt(x); return k > 0.00003 ? 0 : k < -0.00003 ? 2 : Math.floor(rng() * 3); },
    /* the middle lane gets a fair share: a toddler who never steers still finds stars */
    pickLane(x) { const r = rng(); return r < 0.3 ? 1 : r < 0.72 ? this.inside(x) : Math.floor(rng() * 3); },
    /* a ground item; refuses ramp zones, 3-lane walls and stacking on another prop */

    [sig, con1, sig, "breather", sig, con2, sig],

  if (n === 2) rhythm.splice(1, 0, BEATS.puddleParty);

  if (rhythm[0].kind !== "star") run(BEATS.trailStraight);   /* every road opens with stars, never a wall */
  /* a finale keeps its last 560 units for the star shower; ramps must have landed by then */
  const showerX = finale ? endX - 560 : Infinity, loopEnd = finale ? showerX - 200 : endX - 350;
  while (x < loopEnd && guard++ < 60) {
    const lastChance = x + 200 + flightLen(w) + 700 > loopEnd;   /* one more formation and the ramp wouldn't fit */
    if (ri < nRamps && (x >= rampXs[ri] - 450 || lastChance)) {   /* a different ramp beat from the last one */
      let rb = pick(rampPool); if (rampPool.length > 1 && beats[beats.length - 1] === rb.name) rb = rampPool[(rampPool.indexOf(rb) + 1) % rampPool.length];

  if (finale) { x = Math.max(x, showerX); run(BEATS.starShower); }   /* grand finale: a star shower right before the flags */

  const removeProp = p => { p.wrap.remove(); props.splice(props.indexOf(p), 1); if (p.type === "star") totalStars--; };
  for (const p of props.slice()) if (BLOCKER_T(p.type) && inRampZone(p.x)) removeProp(p);
  const count = f => props.filter(f).length;
  /* drop one item into a free pocket: clear lane, no other ground item right beside it */
  const spotFor = (t, want) => {

function addItem(t, x, lane) {

  if (t === "capsule") addProp(t, x, lane, 0, capsuleSVG, -35, -74);
  if (t === "oil")     addProp(t, x, lane, 0, oilSVG, -75, -36);
  if (t === "tnt")     addProp(t, x, lane, 0, tntSVG, -35, -68);
  if (t === "barrel")  addProp(t, x, lane, 0, barrelSVG, -33, -82);
  if (t === "rock")    addProp(t, x, lane, 0, rockSVG, -42, -64);
  if (t === "puddle")  addProp(t, x, lane, 0, puddleSVG, -115, -52);
  if (t === "star") { addProp(t, x, lane, LOW_STAR_H, starSVG, -32, -32); totalStars++; }

/* world plumbing: themes, movers */
function addWorldProp(t, x, lane) {

  const p = addProp(t, x, lane, 0, ep.svg, ep.xOff, ep.yOff);

            bands: ["#ef7d6d", "#ff9f1c", "#ffd60a", "#74c465", "#6fc0df", "#b388ff"] }

let roadPal = ROAD_PAL[1];
function applyTheme(w) {
  const cl = roadScene.classList;
  [...cl].filter(c => c === "sunset" || c === "night" || c === "parade" || /^w\d+$/.test(c)).forEach(c => cl.remove(c));
  if (w === 2) cl.add("sunset");
  else if (w === 3) cl.add("night");
  else if (w >= 4) cl.add("w" + w);
  roadPal = ROAD_PAL[w] || ROAD_PAL[1];
  buildWeather(w);
}
function buildWeather(w) {
  const el = document.getElementById("weather");
  el.innerHTML = "";
  const spec = (typeof WORLD_WEATHER !== "undefined") && WORLD_WEATHER["w" + w];
  if (!spec) return;
  const rng = mulberry32(w * 131);
  for (let i = 0; i < spec.count; i++) {
    const d = document.createElement("div");
    const conf = spec.make(i, rng);
    d.className = conf.className;
    d.style.cssText += conf.cssText;
    el.appendChild(d);
  }
}
function tickMovers(dt) {
  for (const p of props) {
    if (p.done || !p.mv) continue;
    if (p.mv.vx) {   /* tumbleweed: rolls down the road toward the car */
      p.x += p.mv.vx * dt;
      p.mvSpin = (p.mvSpin || 0) - dt * 260;
      p.el.style.transform = `rotate(${p.mvSpin}deg)`;
    }
    if (p.mv.laneHop) {   /* crab: scuttles sideways between lanes */
      p.mvT = (p.mvT || 0) + dt;
      if (p.mvT >= p.mv.laneHop) {
        p.mvT = 0;
        p.mvDir = p.mvDir || 1;
        if (p.lane + p.mvDir > 2 || p.lane + p.mvDir < 0) p.mvDir *= -1;
        p.lane += p.mvDir;
      }
      p.lx += (laneX(p.lane) - p.lx) * Math.min(1, dt * 8);
    }
    if (p.mv.pulse) { p.mvT = (p.mvT || 0) + dt; p.erupt = (p.mvT + p.x * 0.003) % p.mv.pulse < p.mv.pulse * 0.42; p.el.classList.toggle("erupting", p.erupt); }   /* geyser: erupts on a timer, phase by position */
  }
}

   world; the roadsides are lined with set dressing drawn from a per-world pool (seeded per
   level, so no two levels line up the same) and, every so often, a structure spanning the
   whole road that the car drives under */

  return `

        <rect x="-70" y="-196" width="200" height="12" fill="#e76f51"/>

        <rect x="104" y="-120" width="28" height="24" rx="4" fill="#ffb703"/>
      </g>
      <g transform="translate(${x + 420},462)">
        <rect x="0" y="-130" width="120" height="130" fill="#adb5bd"/>
        <rect x="12" y="-116" width="24" height="24" fill="#4cc9f0"/><rect x="52" y="-116" width="24" height="24" fill="#4cc9f0"/>
        <rect x="12" y="-76" width="24" height="24" fill="#4cc9f0"/><rect x="52" y="-76" width="24" height="24" fill="#4cc9f0"/>
        <rect x="88" y="-150" width="16" height="150" fill="#6c757d"/>

}

/* ---- projection: one sprite onto the stage ---- */
const FLAT_PROPS = new Set(["puddle", "oil", "ice", "finish", "fan", "trophy", "scenery"]);
function placeSprite(p, carX) {
  const z = p.x - carX;
  if (z > DRAW_FAR || z < DRAW_NEAR) {
    if (p.vis) { p.wrap.style.display = "none"; p.vis = false; }
    return;
  }
  if (!p.vis) { p.wrap.style.display = "block"; p.vis = true; }
  const s = CAM_D / (z + CAM_D);
  const sx = 600 + (p.lx + offAt(z) - camX) * s;
  const sy = HORIZON + (CAM_H + camElev - elevAt(p.x) - p.h) * s;
  p.wrap.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${(s * p.k).toFixed(4)})`;
  /* nearer = higher; the car sits at depth 10. Something the car just hit or grabbed
     pops out over it (it happens up by the hood, which the body otherwise hides) */
  const zi = (p.done && !FLAT_PROPS.has(p.type) ? 25000 : 20000) - Math.round(z);
  if (zi !== p.zi) { p.wrap.style.zIndex = zi; p.zi = zi; }
  const op = z > DRAW_FAR - FADE ? ((DRAW_FAR - z) / FADE).toFixed(2) : "";
  if (op !== p.op) { p.wrap.style.opacity = op; p.op = op; }
}

/* ---- the ground plane: grass bands, road, rumble strips, lane dashes, ramps, finish ---- */
const SEG = 160;
function proj(z, lx, h) {
  const s = CAM_D / (z + CAM_D);
  return [600 + (lx + offAt(z) - camX) * s, HORIZON + (CAM_H + camElev - elevAt(curCarX + z) - (h || 0)) * s, s];
}
function quad(c, z0, z1, l0, l1, col, h0, h1) {
  const a = proj(z0, l0, h0), b = proj(z0, l1, h0), d = proj(z1, l1, h1), e = proj(z1, l0, h1);

}
function drawRoad(carX) {
  const c = rctx, P = roadPal;
  c.clearRect(0, 0, 1200, 700);
  c.fillStyle = P.ground;
  c.fillRect(0, HORIZON, 1200, 700 - HORIZON);
  /* the ground plane itself follows the hills, so a rise lifts the whole landscape */
  for (let z = DRAW_FAR + 1200; z > DRAW_NEAR; z -= 400) quad(c, Math.max(DRAW_NEAR, z - 400), z, -7000, 7000, P.ground);
  /* the far road: coarse bands out past the fade, so a bend keeps curving to the haze */
  for (let z = DRAW_FAR + 1200; z >= 2400; z -= 400) quad(c, z - 400, z, -ROAD_HALF, ROAD_HALF, P.road);
  /* banded near road: alternating stripes sell the speed */
  const first = Math.floor((carX + DRAW_NEAR) / SEG);
  for (let k = Math.floor((carX + 2400) / SEG); k >= first; k--) {
    const z0 = Math.max(DRAW_NEAR, k * SEG - carX), z1 = (k + 1) * SEG - carX;
    const odd = k & 1;
    if (odd) quad(c, z0, z1, -4000, 4000, P.ground2);
    quad(c, z0, z1, -ROAD_HALF, ROAD_HALF, P.bands ? P.bands[((k % 6) + 6) % 6] : odd ? P.road2 : P.road);
    quad(c, z0, z1, -ROAD_HALF - 26, -ROAD_HALF, odd ? P.rumA : P.rumB);
    quad(c, z0, z1, ROAD_HALF, ROAD_HALF + 26, odd ? P.rumA : P.rumB);
  }
  /* lane dashes: 60 on, 60 off */
  for (let d = Math.floor((carX + DRAW_NEAR) / 120) * 120; d < carX + 2400; d += 120) {
    const z0 = Math.max(DRAW_NEAR, d - carX), z1 = d + 60 - carX;
    if (z1 <= z0) continue;
    quad(c, z0, z1, -LANE_W / 2 - 6, -LANE_W / 2 + 6, P.dash);
    quad(c, z0, z1, LANE_W / 2 - 6, LANE_W / 2 + 6, P.dash);
  }
  /* finish line: a checkered band across the road */
  if (!freeMode) {
    const zf = LEVEL_LEN - carX;
    if (zf > DRAW_NEAR && zf < DRAW_FAR) {
      for (let r = 0; r < 2; r++) for (let col = 0; col < 12; col++) {
        const l0 = -ROAD_HALF + col * (ROAD_HALF / 6);
        quad(c, Math.max(DRAW_NEAR, zf + r * 30), zf + r * 30 + 30, l0, l0 + ROAD_HALF / 6, (r + col) % 2 ? "#fff" : "#212529");
      }

    quad(c, zz0, z1, -ROAD_HALF + 10, ROAD_HALF - 10, "#e9c46a", hh0, rp.h);
    for (const f of [0.3, 0.6, 0.9]) {

      if (za < zz0) continue;

    if (freeSceneryX > freeArchX + 1600 && Math.random() < 0.22) {
      const ax = freeSceneryX + 225;

  for (let i = scenery.length - 1; i >= 0; i--) {

  }
  for (let i = props.length - 1; i >= 0; i--) {
    if (props[i].x < pos - 700) { props[i].wrap.remove(); props.splice(i, 1); }
  }
  for (let i = scenery.length - 1; i >= 0; i--) {
    if (scenery[i].x < pos - 700) { scenery[i].wrap.remove(); scenery.splice(i, 1); }
  }

       haze are rebuilt from the new world's pool so the change rolls in from the horizon */

const PROP_HIT = {
  capsule(p, d) {
    if (Math.abs(laneVis - p.lane) > 0.65) return;
    if (Math.abs(d) < 75) {
      p.done = true;
      p.el.innerHTML = capsulePopSVG;
      sfx.capsuleOpen();

  cone(p, d) {
    if (Math.round(laneVis) !== p.lane) return;

      p.done = true; p.el.classList.add("knocked"); sfx.boink();
      v *= 0.85;                                   /* soft: fun tumble, tiny slow */
    }
  },
  barrel(p, d) { hardHit(p, d, 1); },
  rock(p, d) { hardHit(p, d, 1); },
  tnt(p, d) {
    if (Math.round(laneVis) !== p.lane) return;
    if (d > -20 && d < 95 && v > 25 && jumpY < 45) {
      p.done = true; v = 0; sfx.boom();

  oil(p, d) {

    if (!finished) {

    }

    progDot.style.left = Math.min(100, pos / LEVEL_LEN * 100) + "%";
  }

  const carX = pos + CAR_SCREEN_X;

  /* lane glide */
  laneVis += (targetLane - laneVis) * Math.min(1, dt * 9);
  if (Math.abs(targetLane - laneVis) < 0.01) laneVis = targetLane;
  carWrap.style.zIndex = 19990;   /* depth 10: props a hair past the bumper draw behind it */

  tickMovers(dt);

  /* ramp + jump */
  if (airborne) {

    jumpY += vy * dt;

  for (const p of props) {

  /* wheels */
  wheelAngle = (wheelAngle + v * dt * 0.045) % 7;   /* tread bands are 7 apart */
  wheelEls.forEach(w => w.style.transform = `translateY(${wheelAngle.toFixed(1)}px)`);

  /* body dynamics: lean back on the gas, dive on the brake, bank through lane changes */
  const accel = dt > 0 ? (v - prevV) / dt : 0;

  tickSteer(dt);
  /* world + car. From behind: bank into lane changes, squat on the gas, lift on the brake */

  let bank = (targetLane - laneVis) * 7;
  bank += curvAt(pos + CAR_SCREEN_X) * v * 60;   /* lean into the bend at speed */
  if (airborne) bank += Math.sin(now / 90) * 2;
  const squat = Math.max(-6, Math.min(6, bodyTilt * 0.7));

  const cdx = carScreenX() - 600;
  carWrap.style.transform = `translate(${cdx.toFixed(1)}px,${(squat - jumpY).toFixed(1)}px) skewX(${Math.atan(cdx / CAM_H).toFixed(4)}rad) rotate(${bank.toFixed(2)}deg)`;

/* ---- the three hook-ins ---- */
function worldAudioStart() {
  if (paradeMode) { /* parade keeps its own fixed schedule */ LEVEL_EVENTS = []; eventIdx = 0; eventsFired = 0; scheduleEvents(PARADE_LEVEL, 1); }
  if (!actx) return;
  try { playJingle(); ambStart(); scrubStart(); } catch (e) { /* audio hiccups never stop a level */ }
}
function worldAudioStop() {
  document.querySelectorAll(".liveEv").forEach(e => e.remove());   /* their removal timers die with gagTimers */
  try { ambStop(); scrubStop(); } catch (e) {}
}
function worldTick(dt) {
  if (actx) { ambTick(dt); scrubSet(); }
  eventsTick();
}

/* ============ FINISH + CELEBRATION ============ */
function confettiBurst(sceneEl, count) {
  const cols = ["#e63946", "#ffd60a", "#43a047", "#1e88e5", "#ec407a", "#fb8c00"];
  for (let i = 0; i < count; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 1200 + "px";
    c.style.background = cols[i % cols.length];
    c.style.setProperty("--spin", (Math.random() * 900 - 450) + "deg");
    c.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    c.style.animationDelay = (Math.random() * 0.8) + "s";
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
    sceneEl.appendChild(c);
  }
  setTimeout(() => sceneEl.querySelectorAll(".confetti").forEach(c => c.remove()), 4200);
}

/* a star pops out of the tally and sails into the wallet chip */
function flyStar(fromEl, toEl) {
  const rd = roadScene.getBoundingClientRect();
  const s = rd.width / 1200;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "flyStar"; d.innerHTML = starIcon;
  d.style.left = ((a.left + a.width / 2 - rd.left) / s - 22) + "px";
  d.style.top = ((a.top + a.height / 2 - rd.top) / s - 22) + "px";
  roadScene.appendChild(d);
  requestAnimationFrame(() => {
    d.style.transform = `translate(${(b.left - a.left + (b.width - a.width) / 2) / s}px, ${(b.top - a.top + (b.height - a.height) / 2) / s}px) scale(.45)`;
    d.style.opacity = ".2";
  });
  setTimeout(() => d.remove(), 700);
}

function finishLevel() {
  sfx.tada();
  confettiBurst(roadScene, 90);
  roadScene.classList.add("celebrating");   /* run HUD steps aside: one star number at a time */

  const clean = runDamage === 0;
  const isParade = paradeMode;
  const prev = isParade ? null : progress.levels[level];
  /* first time beating a world's last level = big trophy bonus;
     finishing the parade = the champion jackpot (a warm 10 on replays) */
  const worldBonus = isParade
    ? (progress.badges.includes("champ") ? 10 : 100)
    : (level % WORLD_SIZE === 0 && !prev) ? 25 : 0;
  const bonus = 3 + (clean ? 2 : 0) + worldBonus;   /* clean-run bonus: no new dings this run */
  const banked = runStars + bonus;
  const frac = totalStars ? runStars / totalStars : 1;
  const rating = isParade ? 3 : frac >= 0.65 ? 3 : frac >= 0.34 ? 2 : 1;
  if (worldBonus) { confettiBurst(roadScene, isParade ? 260 : 160); setTimeout(() => sfx.tada(), 600); }
  if (isParade) setTimeout(() => sfx.tada(), 1200);

  const walletStart = progress.wallet;
  progress.wallet += banked;
  const tier = isParade ? "S" : timeTier(level, runTime);

  /* album keepsakes: a finish-line photo of this exact build, plus first-time stickers */
  progress.photos.unshift({ b: JSON.parse(JSON.stringify(state)), n: level, t: tier, s: runStars });
  progress.photos = progress.photos.slice(0, 6);
  if (isParade) award("champ");
  else {
    if (clean) award("clean");
    if (tier === "S") award("s");
    if (worldBonus) award("world");
  }
  if (!isParade) {
    progress.levels[level] = {
      best: Math.max(prev ? prev.best : 0, runStars),
      rating: Math.max(prev ? prev.rating : 0, rating),
      bestTime: Math.min(prev && prev.bestTime ? prev.bestTime : Infinity, Math.round(runTime * 10) / 10),
      tier: (prev && prev.tier && TIER_RANK[prev.tier] > TIER_RANK[tier]) ? prev.tier : tier
    };
    if (level < MAX_LEVEL) progress.current = Math.max(progress.current, level + 1);
  }
  save();

  /* build the tally UI */
  const tally = document.getElementById("tallyChip");
  tally.innerHTML = starIcon + `<span>0</span>`;
  const cWallet = document.getElementById("celebrateWallet");
  cWallet.innerHTML = starIcon + `<span>${walletStart}</span>`;
  const cTime = document.getElementById("celebrateTime");
  cTime.innerHTML = isParade
    ? `<span class="medal">${BADGES.find(b => b.id === "champ").icon}</span>`
    : stopwatchIcon + `<span>${Math.floor(runTime)}</span>` + `<span class="medal">${medalSVG(tier)}</span>`;
  const cDamage = document.getElementById("celebrateDamage");
  cDamage.innerHTML = wrenchIcon + `<span>${progress.damage}</span>`;
  cDamage.classList.toggle("clean", clean);
  /* the wrench is garage business — only show it on the victory screen if this run got dinged */
  cDamage.style.display = runDamage > 0 ? "" : "none";
  const ratingRow = document.getElementById("ratingRow");
  ratingRow.innerHTML = [1, 2, 3].map(() =>
    `<svg class="rateStar" viewBox="0 0 64 64"><path d="M32 2 L40 22 L62 24 L45 39 L51 61 L32 48 L13 61 L19 39 L2 24 L24 22 Z" fill="#ffd60a" stroke="#fb8500" stroke-width="3"/></svg>`).join("");
  document.getElementById("nextBtn").style.display = (level < MAX_LEVEL && !isParade) ? "" : "none";

  celebrateTimer = setTimeout(() => {
    document.getElementById("celebrate").classList.add("active");
    /* count the stars up one by one, then light the rating */
    let shown = 0;
    const span = tally.querySelector("span");
    const walletSpan = cWallet.querySelector("span");
    tallyTimer = setInterval(() => {
      shown++;
      span.textContent = shown;
      walletSpan.textContent = walletStart + shown;
      flyStar(tally, cWallet);
      cWallet.classList.remove("pop"); void cWallet.offsetWidth; cWallet.classList.add("pop");
      sfx.tick(shown);
      tally.classList.remove("pop"); void tally.offsetWidth; tally.classList.add("pop");
      if (shown >= banked) {
        clearInterval(tallyTimer); tallyTimer = null;
        const rs = ratingRow.querySelectorAll(".rateStar");
        for (let i = 0; i < rating; i++) {
          rateTimers.push(setTimeout(() => { rs[i].classList.add("lit"); sfx.chime(); }, 250 + i * 350));
        }
        /* Nintendo pacing: the payoff plays out first, THEN the buttons slide in */
        rateTimers.push(setTimeout(() => {
          document.getElementById("celebrateRow").classList.add("ready");
        }, 250 + rating * 350 + 450));
      }
    }, banked > 15 ? 60 : 120);   /* long tallies (world bonus) tick twice as fast */
  }, 700);
}

      el.innerHTML = `<svg viewBox="0 0 60 60" width="60" height="60"><ellipse cx="30" cy="50" rx="28" ry="9" fill="${lava}"/><ellipse cx="30" cy="49" rx="16" ry="5" fill="${lava2}"/>${[[6, 36], [52, 34], [30, 28], [16, 26]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="${lava}"/>`).join("")}</svg>`;
      noiseBurst(0.18, 700, 0.25); tone("sine", 220, 60, 0.25, 0.25);
    }, 1300);
  };
  LIVE_EVENTS.pterodactyl = () => {   /* a friendly pterodactyl glides across the sky, flapping, with two happy caws */
    const ink = skyInk(), top = 50 + Math.random() * 100;
    evEl("evPtero", `<svg viewBox="0 0 180 90" width="180" height="90"><path d="M90 50 Q60 14 10 30 Q40 40 60 58 Z M90 50 Q120 14 170 30 Q140 40 120 58 Z" fill="${ink}"/><path d="M90 50 Q104 54 110 64 L148 72 L112 72 Q98 70 90 56 Z M108 62 L96 48 L114 58 Z M90 50 L60 78 L72 56 Z" fill="${ink}"/><circle cx="114" cy="66" r="3" fill="#ffd60a"/></svg>`, -200, top, 3500);
    [0.4, 1.6].forEach(d => { tone("sawtooth", 700, 1100, 0.18, 0.05, d); tone("sine", 1100, 800, 0.2, 0.06, d + 0.15); });
  };
  LIVE_EVENTS.sprinkleShower = () => {   /* a sudden shower of sprinkles across the whole sky */
    let h = "";
    for (let i = 0; i < 26; i++) h += `<i class="evSprk" style="left:${Math.floor(Math.random() * 1200)}px; top:${-40 - Math.floor(Math.random() * 120)}px; background:${CANDY[i % CANDY.length]}; height:${12 + Math.floor(Math.random() * 8)}px; animation-duration:${(1.4 + Math.random() * 0.9).toFixed(2)}s; animation-delay:${(Math.random() * 0.6).toFixed(2)}s"></i>`;
    evEl("evShower", h, 0, 0, 3200);
    [0, 0.15, 0.3, 0.5, 0.7].forEach(d => noiseBurst(0.06, 6000, 0.05, d)); [1568, 1760, 2093, 2349].forEach((f, i) => tone("sine", f, f, 0.25, 0.07, 0.1 + i * 0.12));
  };
  LIVE_EVENTS.jellyBean = () => {   /* a jelly bean boings along the skyline, squashing on every landing */
    const c = CANDY[Math.floor(Math.random() * CANDY.length)];
    evEl("evBean", `<svg viewBox="0 0 70 50" width="70" height="50"><path d="M14 10 Q35 -2 56 10 Q70 25 56 40 Q35 52 14 40 Q0 25 14 10 Z" fill="${c}"/><ellipse cx="22" cy="18" rx="8" ry="5" fill="#fff" opacity=".7"/><circle cx="40" cy="22" r="3" fill="#2b2d42"/><circle cx="52" cy="22" r="3" fill="#2b2d42"/><path d="M42 30 Q47 35 52 30" stroke="#2b2d42" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`, -80, 246, 3100);
    [0, 0.75, 1.5, 2.25].forEach(d => tone("sine", 500, 900, 0.1, 0.1, d + 0.37));

  LIVE_EVENTS.chocoFountain = () => {   /* a chocolate fountain on the horizon burps up a blob and bubbles */
    evEl("evFountain", `<svg viewBox="0 0 160 160" width="160" height="160"><path d="M30 156 L40 126 H120 L130 156 Z" fill="#8d5a3c"/><rect x="66" y="80" width="28" height="48" fill="#6b3e26"/><ellipse cx="80" cy="82" rx="40" ry="10" fill="#6b3e26"/><g class="evFBlob"><ellipse cx="80" cy="72" rx="26" ry="20" fill="#8d5a3c"/><circle cx="62" cy="64" r="8" fill="#a9714f"/><circle cx="96" cy="60" r="7" fill="#a9714f"/><circle cx="80" cy="50" r="6" fill="#a9714f"/></g>${[50, 80, 110].map(x => `<circle class="evFBub" cx="${x}" cy="76" r="5" fill="#a9714f"/>`).join("")}</svg>`, 200 + Math.random() * 700, 150, 3000);
    tone("sine", 180, 70, 0.35, 0.18, 0.5); noiseBurst(0.25, 500, 0.14, 0.5); [0.9, 1.1, 1.35].forEach(d => tone("sine", 600 + Math.random() * 300, 300, 0.08, 0.08, d));

})();

/* ======== WORLD PACK anchor B: worlds 11-12 register here (same contract) ======== */

/* ============ NEW VERSION GATE ============ */
/* No service worker here: a stale game is Safari's cache or a home-screen app left running.
   Fingerprint the code this page booted with, and quietly compare it against a fresh copy
   from the server on boot, whenever the app comes back to the foreground, and every 10 min. */
const updateBtn = document.getElementById("updateBtn");
const bootCode = (() => {
  const st = document.querySelector("style"), sc = document.querySelector("script");
  return (st ? st.textContent : "") + (sc ? sc.textContent : "");
})();
function codeHash(str) {   /* FNV-1a: plenty for "did it change" */
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
const bootHash = codeHash(bootCode);
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (location.protocol === "file:" || Date.now() - lastUpdateCheck < 30000) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const st = doc.querySelector("style"), sc = doc.querySelector("script");
    if (!st || !sc) return;
    if (codeHash(st.textContent + sc.textContent) !== bootHash) updateBtn.classList.add("show");
  } catch (e) { /* offline in the car: keep playing what we have */ }
}
const UPDATE_HOLD_MS = 1600;
let updateHoldT = null, updateHoldStart = 0, updateHoldRaf = null;
const updateRing = updateBtn.querySelector(".ring");
function updateHoldEnd() {
  clearTimeout(updateHoldT); cancelAnimationFrame(updateHoldRaf);
  updateHoldT = null;
  updateBtn.classList.remove("holding");
  updateRing.style.strokeDashoffset = 251.3;
}
updateBtn.addEventListener("pointerdown", e => {
  e.stopPropagation();
  try { updateBtn.setPointerCapture(e.pointerId); } catch (err) {}
  sfx.pop();
  updateBtn.classList.add("holding");
  updateHoldStart = performance.now();
  (function fill() {
    const f = Math.min(1, (performance.now() - updateHoldStart) / UPDATE_HOLD_MS);
    updateRing.style.strokeDashoffset = 251.3 * (1 - f);
    if (f < 1) updateHoldRaf = requestAnimationFrame(fill);
  })();
  updateHoldT = setTimeout(() => {
    save();
    sfx.tada();
    /* cache-busting navigation so Safari can't hand back the old page */
    setTimeout(() => location.replace(location.pathname + "?v=" + Date.now() + location.hash), 350);
  }, UPDATE_HOLD_MS);
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) updateBtn.addEventListener(ev, () => { if (updateHoldT) updateHoldEnd(); });
setTimeout(checkForUpdate, 2500);
setInterval(checkForUpdate, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
</script>
